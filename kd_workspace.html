<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KD 업무</title>
<style>
  :root{
    --bg:#F4F7F4; --surface:#FFFFFF; --ink:#15231B; --muted:#647268;
    --line:#E4E9E3; --kd:#1E4D3A; --kd-soft:#E8F0EB; --kd-tint:#F3F8F4;
    --alert:#DC2626; --alert-soft:#FDECEC; --alert-line:#F4C7C7;
    --amber:#B45309; --amber-soft:#FBF0E2; --done:#3F7A5C; --done-soft:#EAF3EE;
    --shadow:0 1px 2px rgba(21,35,27,.04),0 8px 24px rgba(21,35,27,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;} a{color:inherit;text-decoration:none;} svg{display:block;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.4);}70%{box-shadow:0 0 0 9px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
  @keyframes dotpulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  @keyframes cardin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes barin{from{width:0;}}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .app{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;}
  .mark{width:36px;height:36px;border-radius:10px;background:var(--kd);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;}
  .side-brand .bt{font-size:15px;font-weight:800;letter-spacing:-.2px;} .side-brand .bs{font-size:11px;color:var(--muted);font-weight:500;}
  .langtoggle{display:flex;gap:4px;margin:0 16px 8px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line);}
  .head-right .langtoggle{margin:0;flex-shrink:0;}
  .head-right .langtoggle button{flex:none;padding:6px 12px;white-space:nowrap;}
  .langtoggle button{flex:1;border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 0;border-radius:6px;transition:.12s;white-space:nowrap;}
  .langtoggle button.on{background:var(--surface);color:var(--kd);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  nav{flex:1;overflow-y:auto;padding:6px 12px 18px;border-top:1px solid var(--line);}
  .nav-group{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;padding:16px 10px 7px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s;margin-bottom:1px;}
  .nav-item:hover{background:var(--kd-tint);} .nav-item.on{background:var(--kd-soft);color:var(--kd);} .nav-item.on .ic{color:var(--kd);}
  .nav-item .ic{color:var(--muted);flex-shrink:0;}
  .nav-item .soon{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:5px;}
  .nav-item .nbadge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;animation:dotpulse 1.6s infinite;}
  .nav-group.tap{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;
    transition:.12s;user-select:none;padding:16px 10px 7px;}
  .nav-group.tap:hover{color:var(--kd);}
  .nav-group.tap .chev{transition:transform .18s;flex-shrink:0;}
  .nav-group.tap.closed .chev{transform:rotate(-90deg);}
  .nav-group.tap .n{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--muted);
    background:var(--bg);padding:2px 6px;border-radius:5px;}
  .nav-links{overflow:hidden;}
  .nav-links.closed{display:none;}
  .nav-link{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;color:var(--ink);
    font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;margin-bottom:1px;}
  .nav-link:hover{background:var(--kd-tint);}
  .nav-link .fav{width:17px;height:17px;border-radius:4px;flex-shrink:0;background:var(--bg);object-fit:contain;}
  .nav-link .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-link .go{color:var(--line);flex-shrink:0;opacity:0;transition:.12s;}
  .nav-link:hover .go{opacity:1;color:var(--kd);}
  .nav-addlink{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;color:var(--muted);
    font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px dashed var(--line);margin-top:5px;transition:.12s;}
  .nav-addlink:hover{border-color:var(--kd);color:var(--kd);}
  .lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:7px;background:var(--surface);}
  .lrow img{width:18px;height:18px;border-radius:4px;flex-shrink:0;}
  .lrow .ln{font-size:13px;font-weight:700;flex-shrink:0;}
  .lrow .lu{font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lrow .lmv{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;
    width:24px;height:24px;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;}
  .lrow .lmv:hover{border-color:var(--kd);color:var(--kd);}
  .lrow .lmv:disabled{opacity:.3;cursor:default;}
  .addrow2{display:flex;gap:7px;margin-top:11px;} .addrow2 input.n{width:150px;flex-shrink:0;} .addrow2 input.u{flex:1;}
  .addrow2 button{background:var(--kd);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:12.5px;}
  @media(max-width:640px){.addrow2{flex-wrap:wrap;}.addrow2 input.n{width:100%;}}
  .side-foot{padding:12px;border-top:1px solid var(--line);}
  .userchip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--bg);}
  .userchip .av{width:28px;height:28px;border-radius:50%;background:var(--kd);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;}
  .userchip .un{font-size:12.5px;font-weight:700;} .userchip .ur{font-size:10.5px;color:var(--muted);}
  .hamb{display:none;}
  @media(max-width:880px){.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.18);}.sidebar.open{transform:none;}}

  .content{flex:1;min-width:0;}

  /* ===== 입금관리 ===== */
  .dep-rows{display:flex;flex-direction:column;gap:8px;}
  .drow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);transition:.14s;animation:cardin .2s ease;}
  .drow:hover{border-color:#C8D2CB;}
  .drow.over{border-color:var(--alert-line);background:#FFFBFB;}
  .drow.over::before{content:"";width:4px;height:34px;border-radius:3px;background:var(--alert);flex-shrink:0;margin:-2px 0;}
  .drow.paid{opacity:.7;background:#FBFDFB;}
  .drow.paid::before{content:"";width:4px;height:34px;border-radius:3px;background:var(--done);flex-shrink:0;margin:-2px 0;}
  .drow .dwho{min-width:0;flex:1;}
  .drow .dnm{font-size:14px;font-weight:800;letter-spacing:-.2px;}
  .drow .dsub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .drow .dnos{display:flex;gap:4px;flex-wrap:wrap;max-width:230px;}
  .drow .dno{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px;cursor:pointer;transition:.12s;}
  .drow .dno:hover{border-color:var(--kd);color:var(--kd);}
  .drow .ddue{text-align:right;min-width:96px;}
  .drow .ddue .dd{font-size:12.5px;font-weight:800;}
  .drow .ddue .dl{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;}
  .drow.over .ddue .dd{color:var(--alert);}
  .drow .damt{text-align:right;min-width:108px;font-size:17px;font-weight:800;letter-spacing:-.4px;color:#2563A8;}
  .drow.paid .damt{color:var(--done);}
  .drow.over .damt{color:var(--alert);}
  .dchip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap;}
  .dchip.pend{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
  .dchip.over{background:var(--alert-soft);color:var(--alert);border:1px solid var(--alert-line);}
  .dchip.paid{background:var(--done-soft);color:var(--done);border:1px solid #C6E2D2;}
  .dbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;
    display:grid;place-items:center;color:#C3CDC6;flex-shrink:0;transition:.12s;}
  .dbtn:hover{border-color:var(--done);color:var(--done);}
  .dbtn.on{background:var(--done);border-color:var(--done);color:#fff;}
  .dbtn.on:hover{background:var(--done);opacity:.85;}
  @media(max-width:900px){.drow{flex-wrap:wrap;gap:9px;}.drow .dnos{max-width:100%;order:5;flex-basis:100%;}}

  /* ===== 업무확인 패널 (오른쪽 고정) ===== */
  .checkpanel{width:290px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
  .cp-day{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  .cp-date{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.25;}
  .cp-dow{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;}
  .cp-wx{display:flex;align-items:center;gap:11px;margin-top:13px;background:var(--kd-tint);
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .cp-wx .wi{flex-shrink:0;font-size:26px;line-height:1;}
  .cp-wx .wt{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .cp-wx .wd{font-size:11.5px;color:var(--muted);font-weight:600;}
  .cp-wx .wc{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;}
  .cp-wx.err{background:var(--bg);}
  .cp-fx{display:flex;align-items:center;gap:10px;margin-top:9px;background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:9px 12px;}
  .cp-fx.col{flex-direction:column;align-items:stretch;gap:8px;}
  .cp-fx .fx-top{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;}
  .cp-fx .fx-top .fx-i{font-size:16px;}
  .cp-fx .fx-top .fx-r b{font-weight:800;}
  .cp-fx .fxchg{margin-left:auto;font-size:10.5px;font-weight:800;white-space:nowrap;}
  .cp-fx .fxchg.up{color:#C0392B;} .cp-fx .fxchg.down{color:#2563A8;}
  .cp-fx .fx-calc{display:flex;flex-direction:column;gap:6px;}
  .cp-fx .fx-in,.cp-fx .fx-out{display:flex;align-items:baseline;gap:5px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;}
  .cp-fx .fx-in input{border:none;background:transparent;outline:none;width:100%;font-size:15px;
    font-weight:800;color:var(--ink);font-family:inherit;text-align:right;min-width:0;}
  .cp-fx .fx-out{justify-content:flex-end;}
  .cp-fx .fx-out b{font-size:15px;font-weight:800;color:#2563A8;text-align:right;flex:1;min-width:0;
    overflow:visible;white-space:nowrap;}
  .cp-fx .fx-in .u,.cp-fx .fx-out .u{font-size:10.5px;color:var(--muted);font-weight:700;flex-shrink:0;}
  .cp-fx .fx-arrow{color:var(--muted);font-weight:800;text-align:center;font-size:13px;line-height:1;}
  .cp-fx .fx-note{font-size:10px;color:var(--muted);font-weight:600;text-align:right;}
  .cp-fx.err{color:var(--muted);flex-direction:row;align-items:center;}
  .cp-fx .fxi{font-size:17px;flex-shrink:0;} .cp-fx .fxmain{flex:1;}
  .cp-fx .fxsub{font-size:11.5px;font-weight:600;}
  .cp-fx .fxretry{border:1px solid var(--line);background:var(--surface);color:var(--kd);
    border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;flex-shrink:0;}
  .cp-fx .fxretry:hover{border-color:var(--kd);}
  .cp-head{display:flex;align-items:center;gap:7px;padding:15px 18px 8px;}
  .cp-head .nm{font-size:13.5px;font-weight:800;}
  .cp-head .ct{font-size:11px;font-weight:700;background:var(--alert);color:#fff;min-width:18px;height:18px;
    padding:0 5px;border-radius:9px;display:grid;place-items:center;}
  .cp-head .ct.zero{background:var(--line);color:var(--muted);}
  .cp-hint{font-size:10.5px;color:var(--muted);padding:0 18px 9px;}
  .cp-input{margin:0 14px 10px;position:relative;}
  .cp-input input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;
    padding:10px 12px;font-size:12.5px;font-family:inherit;color:var(--ink);outline:none;transition:.12s;}
  .cp-input input:focus{border-color:var(--kd);background:var(--surface);box-shadow:0 0 0 3px var(--kd-soft);}
  .cp-list{flex:1;overflow-y:auto;padding:0 14px 18px;}
  .cp-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--surface);margin-bottom:6px;transition:.12s;animation:cardin .18s ease;}
  .cp-item:hover{border-color:var(--kd);}
  .cp-box{width:16px;height:16px;border-radius:5px;border:1.8px solid #C3CDC6;flex-shrink:0;margin-top:1px;
    cursor:pointer;display:grid;place-items:center;color:#fff;transition:.12s;}
  .cp-item:hover .cp-box{border-color:var(--kd);}
  .cp-item.done .cp-box{background:var(--done);border-color:var(--done);}
  .cp-txt{font-size:12.5px;font-weight:600;line-height:1.45;flex:1;cursor:pointer;word-break:break-word;}
  .cp-item.done{opacity:.55;} .cp-item.done .cp-txt{text-decoration:line-through;color:var(--muted);}
  .cp-del{border:none;background:transparent;color:var(--line);padding:0;flex-shrink:0;margin-top:1px;transition:.12s;}
  .cp-item:hover .cp-del{color:#B9C3BC;} .cp-del:hover{color:var(--alert)!important;}
  .cp-sep{font-size:10.5px;font-weight:700;color:var(--muted);padding:12px 4px 7px;letter-spacing:.3px;}
  .cp-empty{border:1.5px dashed var(--line);border-radius:11px;padding:22px 10px;text-align:center;
    color:var(--muted);font-size:11.5px;}
  @media(max-width:1180px){.checkpanel{display:none;}}

  .topbar{display:none;}
  @media(max-width:880px){.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}.hamb{display:grid;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);place-items:center;color:var(--ink);}.topbar .tt{font-size:14px;font-weight:800;}}
  .view{padding:clamp(18px,3.5vw,36px);max-width:1200px;}

  .page-head{margin-bottom:18px;}
  .page-head .ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .page-head h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.4px;}
  .page-head .sub{font-size:13px;color:var(--muted);margin:5px 0 0;}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .synced{font-size:11.5px;color:var(--muted);}
  .refresh{border:1px solid var(--line);background:var(--surface);color:var(--kd);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:9px;display:flex;align-items:center;gap:6px;}
  .refresh:hover{border-color:var(--kd);}
  .refresh .sp{width:13px;height:13px;border:2px solid var(--kd-soft);border-top-color:var(--kd);border-radius:50%;}
  .refresh.busy .sp{animation:spin .7s linear infinite;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;transition:.12s;}
  .pill:hover{border-color:var(--kd);color:var(--kd);} .pill.on{background:var(--kd);border-color:var(--kd);color:#fff;}
  .clearnoise{margin-left:auto;border:1px solid var(--alert-line);background:var(--surface);color:var(--alert);font-size:12px;font-weight:700;padding:7px 13px;border-radius:9px;}
  .clearnoise:hover{background:var(--alert-soft);}

  .subtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:22px;width:fit-content;}
  .subtabs button{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:8px 18px;border-radius:8px;transition:.12s;}
  .subtabs button.on{background:var(--kd);color:#fff;}
  .subtabs button .soon{font-size:9.5px;margin-left:5px;opacity:.7;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px;}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);cursor:pointer;transition:.14s;text-align:left;position:relative;}
  .stat:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(21,35,27,.1);}
  .stat.sel{border-color:var(--kd);box-shadow:0 0 0 2px var(--kd-soft);}
  .stat .lab{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px;}
  .stat .val{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1;}
  .stat .unit{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;}
  .stat .arrow{position:absolute;top:15px;right:15px;color:var(--line);transition:.14s;}
  .stat:hover .arrow,.stat.sel .arrow{color:var(--kd);}
  .stat.alert{border-color:var(--alert-line);} .stat.alert.live{animation:pulse 1.9s infinite;} .stat.alert.live .val{color:var(--alert);}
  .stat.alert.sel{box-shadow:0 0 0 2px var(--alert-soft);border-color:var(--alert);}
  .stat.alert .lab i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alert);margin-right:5px;vertical-align:middle;}

  .listwrap{background:transparent;}
  .list-head{display:flex;align-items:center;gap:8px;padding:2px 2px 12px;}
  .list-head .dot{width:9px;height:9px;border-radius:50%;}
  .list-head.todo .dot{background:var(--alert);} .list-head.done .dot{background:var(--done);}
  .list-head.noise .dot{background:#9aa7a0;} .list-head.all .dot{background:var(--kd);}
  .list-head .name{font-size:14px;font-weight:800;} .list-head .count{font-size:11.5px;font-weight:700;background:var(--line);color:var(--muted);padding:1px 8px;border-radius:999px;}
  .list-head .hint{margin-left:auto;font-size:11.5px;color:var(--muted);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
  @media(max-width:760px){.cards{grid-template-columns:1fr;}}
  .empty{border:1.5px dashed var(--line);border-radius:13px;padding:34px 14px;text-align:center;color:var(--muted);font-size:12.5px;grid-column:1/-1;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:var(--shadow);animation:cardin .2s ease;}
  .card.todo{border-color:var(--alert-line);}
  .card.todo::before{content:"";display:block;height:3px;border-radius:3px;background:var(--alert);margin:-14px -15px 12px;animation:dotpulse 1.6s infinite;}
  .card.done,.card.noise{opacity:.9;} .card.noise{background:#FAFBFA;}
  .c-top{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap;}
  .typebadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--kd-soft);color:var(--kd);}
  .typebadge.noise{background:#EDEFED;color:var(--muted);}

/* ===== 회계연도(기) — KD는 10월 설립, 9월 결산. 기: 10월~9월 =====
 * 제1기 = 2025-10 ~ 2026-09. FIRST_FY_START = 2025.
 * "2026-07" 같은 월키(YYYY-MM)가 몇 기에 속하는지, 그 기의 월 순서(10→9)를 계산. */
const FIRST_FY_START=2025;                       // 제1기 시작 연도(10월)
function fyOf(ym){                                // "2026-07" → 기 번호(1,2,…)
  const [y,m]=ym.split("-").map(Number);
  const startYear = m>=10 ? y : y-1;             // 10~12월은 그 해가 시작연도, 1~9월은 전해
  return startYear - FIRST_FY_START + 1;
}
function fyMonths(fy){                            // 기 번호 → 그 기의 월키 12개 (10월~9월 순서)
  const startYear = FIRST_FY_START + (fy-1);
  const out=[];
  for(let i=0;i<12;i++){
    const mm=(9+i)%12+1;                          // 10,11,12,1,...,9
    const yy=(mm>=10)?startYear:startYear+1;
    out.push(yy+"-"+String(mm).padStart(2,"0"));
  }
  return out;                                     // [2025-10 … 2026-09]
}
function fyLabel(fy){ return lang==="ja"?`第${fy}期`:`제${fy}기`; }
function fyRange(fy){
  const s=FIRST_FY_START+(fy-1);
  return `${s}.10 ~ ${s+1}.9`;
}
/* 데이터에 존재하는 기 목록 (최신순). orderList = orders 또는 salesOrders */
function availableFYs(orderList){
  const set=new Set();
  orderList.forEach(o=>{if(o.order_date)set.add(fyOf(o.order_date.slice(0,7)));});
  const arr=[...set].sort((a,b)=>b-a);
  return arr.length?arr:[fyOf(ymd(new Date()).slice(0,7))];
}
/* 연간 막대그래프 SVG — series: [{ym, val}] 12개, color = 막대색 */
function yearBars(fy, valueOf, color){
  const mons=fyMonths(fy);
  const data=mons.map(ym=>({ym, val:valueOf(ym)}));
  const max=Math.max(1,...data.map(d=>d.val));
  const W=760, H=220, padL=8, padB=34, padT=14, gap=10;
  const n=data.length, bw=(W-padL*2-gap*(n-1))/n;
  const bars=data.map((d,i)=>{
    const h=Math.max(2,(d.val/max)*(H-padB-padT));
    const x=padL+i*(bw+gap), y=H-padB-h;
    const mm=Number(d.ym.split("-")[1]);
    const on=d.val>0;
    return `<g class="hbar" data-tip="${mm}${lang==='ja'?'月':'월'}｜${yen(d.val)}">
      <rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4"
        fill="${on?color:'#E5EAE7'}"></rect>
      ${on?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle"
        font-size="9.5" font-weight="700" fill="${color}">${yenShort(d.val)}</text>`:''}
      <text x="${(x+bw/2).toFixed(1)}" y="${H-padB+15}" text-anchor="middle" font-size="11" font-weight="700"
        fill="var(--muted)">${mm}${lang==='ja'?'月':'월'}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${padL}" y1="${H-padB}" x2="${W-padL}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>
    ${bars}</svg>`;
}
/* 기 선택 탭 + 그래프 카드 통짜. valueOf(ym)=그 월의 금액, color, orderList=기 목록용 */
function fyChartCard(orderList, valueOf, color, selFY, dataAttr){
  const fys=availableFYs(orderList);
  const cur = selFY && fys.includes(selFY) ? selFY : fys[0];
  const total=fyMonths(cur).reduce((s,ym)=>s+valueOf(ym),0);
  const tabs=fys.map(fy=>`<button class="fytab ${fy===cur?'on':''}" ${dataAttr}="${fy}">${fyLabel(fy)}<span class="fyr">${fyRange(fy)}</span></button>`).join("");
  return {cur, html:`<div class="fycard">
    <div class="fytabs">${tabs}</div>
    <div class="fyhead"><span class="fyt">${fyLabel(cur)} · ${lang==='ja'?'年間推移':'연간 추이'}</span>
      <span class="fysum">${yen(total)}</span></div>
    ${yearBars(cur, valueOf, color)}
  </div>`};
}

/* ★ 영업이익 전용 손익 막대 — 0선 기준: 매출↑(파랑) / 사입·고정비·경비↓(녹·주·보).
 *   monthData(ym) => {sales,buy,fixed,exp}. 순이익 마이너스면 라벨 빨강. 순이익 추세선(빨강) 오버레이. */
function yenShort(v){                                 // 금액을 ¥ 단위로 짧게 (¥3.98M / ¥285K / ¥0)
  const a=Math.abs(v), sign=v<0?"-":"";
  if(a>=1000000) return sign+"¥"+(a/1000000).toFixed(a>=10000000?0:2).replace(/\.0+$/,"")+"M";
  if(a>=1000)    return sign+"¥"+Math.round(a/1000)+"K";
  return sign+"¥"+a;
}
/* 만엔(万円) 단위. 1,234,567 → "123" (소수1자리 필요시 표시). 0은 "-" */
function man(v){
  if(!v) return "-";
  const m=v/10000;
  const s=(Math.abs(m)>=100?Math.round(m):Math.round(m*10)/10).toLocaleString("ja-JP");
  return s;
}
/* 손익 엑셀표: 행=매출/사입/고정비/경비/영업이익, 열=10~9월+합계. 단위 만엔. */
function pnlTable(fy, monthData){
  const mons=fyMonths(fy);
  const data=mons.map(ym=>monthData(ym));
  const sum=k=>data.reduce((s,d)=>s+(k==='profit'?(d.sales-d.buy-d.fixed-d.exp):d[k]),0);
  const rowDef=[
    {key:'sales', label:t('pSales'), cls:'r-sales'},
    {key:'buy',   label:t('pBuy'),   cls:''},
    {key:'fixed', label:t('pFixed'), cls:''},
    {key:'exp',   label:t('pExp'),   cls:''},
    {key:'profit',label:t('pProfit'),cls:'r-profit'},
  ];
  const head=`<tr><th class="corner">${lang==='ja'?'（万円）':'(만엔)'}</th>`
    +mons.map(ym=>`<th>${Number(ym.split("-")[1])}${lang==='ja'?'月':'월'}</th>`).join("")
    +`<th class="tot">${lang==='ja'?'合計':'합계'}</th></tr>`;
  const body=rowDef.map(rd=>{
    const cells=data.map(d=>{
      const v = rd.key==='profit' ? (d.sales-d.buy-d.fixed-d.exp) : d[rd.key];
      const neg = v<0;
      return `<td class="${neg?'neg':''} ${v?'':'zero'}">${man(v)}</td>`;
    }).join("");
    const tv=sum(rd.key), tneg=tv<0;
    return `<tr class="${rd.cls}"><th class="rowh">${rd.label}</th>${cells}<td class="tot ${tneg?'neg':''}">${man(tv)}</td></tr>`;
  }).join("");
  return `<div class="pnltable-wrap"><table class="pnltable">${head}${body}</table></div>`;
}

function pnlBars(fy, monthData, selYM){
  const mons=fyMonths(fy);
  const rows=mons.map(ym=>{const d=monthData(ym);const cost=d.buy+d.fixed+d.exp;
    return {ym, ...d, cost, profit:d.sales-cost};});
  const maxV=Math.max(1,...rows.map(r=>r.sales));            // 위쪽 축(매출)
  const maxP=Math.max(1,...rows.map(r=>Math.abs(r.profit))); // 아래쪽 축(영업이익)
  const W=820, upH=150, dnH=90, padL=6, gap=16, padT=26, padB=22;
  const n=rows.length, slot=(W-padL*2-gap*(n-1))/n;
  const bw=Math.min(22,(slot-4)/2);
  const zeroY=padT+upH;
  const seg=(x,yTop,h,fill)=>h>0.5?`<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" rx="2"/>`:"";
  const bars=rows.map((r,i)=>{
    const sx=padL+i*(slot+gap);
    const cxSlot=sx+slot/2;
    const xS=cxSlot-bw-2, xP=cxSlot+2;     // 매출막대 x, 영업이익막대 x
    const mm=Number(r.ym.split("-")[1]);
    const has=r.sales>0||r.cost>0;
    const dim = selYM && selYM!=="ALL" && r.ym!==selYM;

    const shS=(r.sales/maxV)*upH;          // 매출 (위로)
    const ph=(Math.abs(r.profit)/maxP)*dnH;
    const pFill = r.profit<0 ? "#E03131" : "#1E7A46";
    // 영업이익: 흑자면 0선 위로(초록), 적자면 0선 아래로(빨강)
    const pBar = has&&ph>0.5
      ? (r.profit<0
          ? `<rect x="${xP.toFixed(1)}" y="${zeroY.toFixed(1)}" width="${bw.toFixed(1)}" height="${ph.toFixed(1)}" fill="${pFill}" rx="2"/>`
          : `<rect x="${xP.toFixed(1)}" y="${(zeroY-Math.min(ph,upH)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.min(ph,upH).toFixed(1)}" fill="${pFill}" rx="2"/>`)
      : "";

async function fetchOrders(){

  buyBusy=true;renderExpenseIf();renderSalesIf();
  try{
    const [ro,rc]=await Promise.all([
      fetch(OMS_URL+"/rest/v1/orders?select=id,client_id,order_no,order_date,total_qty,total_shitadai,status,created_by,created_at,store_snapshot,warehouse&order=order_date.desc",{headers:OMS_H}),
      fetch(OMS_URL+"/rest/v1/clients?select=id,name,code,direction",{headers:OMS_H})
    ]);
    const od=await ro.json(),cd=await rc.json();
    if(!Array.isArray(od)||!Array.isArray(cd))throw new Error("bad");
    // ★ 사입/매출 판별 = OMS clients.direction 기준 (OMS의 「取引の向き」 설정을 그대로 따름)
    //    buy=사입(우리가 삼) / sell=매출(우리가 팜). OMS에서 방향만 정하면 코드 수정 불필요.
    const dir={};cd.forEach(c=>{dir[String(c.id)]=String(c.direction||"").trim().toLowerCase();});
    const isBuy=o=>{
      const d=dir[String(o.client_id)];
      if(d==="buy")return true;
      if(d==="sell")return false;
      // direction이 비어있는 옛 데이터 → 예전 방식(SUPPLIERS)으로 보조 판단
      return SUPPLIERS.map(s=>s.trim().toLowerCase()).includes(String(o.created_by||"").trim().toLowerCase());
    };
    // ★ 매출·사입 모두 '配送済(배송완료)'만 인정. 発注済/発注確認済/保留/キャンセル 은 제외.
    const isShipped=o=>String(o.status||"").trim()==="配送済";
    const shipped=od.filter(isShipped);
    orders=shipped.filter(isBuy);
    salesOrders=shipped.filter(o=>!isBuy(o));
    clientMap={};cd.forEach(c=>clientMap[c.id]={name:c.name||c.code||("#"+c.id),code:c.code});
    months=[...new Set(orders.filter(o=>o.order_date).map(o=>o.order_date.slice(0,7)))].sort().reverse();
    if(!selMonth||!months.includes(selMonth))selMonth=months[0]||null;
    monthsS=[...new Set(salesOrders.filter(o=>o.order_date).map(o=>o.order_date.slice(0,7)))].sort().reverse();
    if(!selMonthS||!monthsS.includes(selMonthS))selMonthS=monthsS[0]||null;
    buyErr=false;
  }catch(e){buyErr=true;}
  buyBusy=false;renderExpenseIf();renderSalesIf();renderProfitIf();if(current==="deposit")renderDeposit();renderNav();
}

function dueInfo(due){
  if(!due)return{txt:t('taskNoDue'),cls:""};
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(due+"T00:00:00");
  const diff=Math.round((d-today)/86400000);
  const txt=(new Date(due+"T00:00:00")).toLocaleDateString(lang==="ja"?"ja-JP":"ko-KR",{month:"numeric",day:"numeric"});
  if(diff<0)return{txt:txt+" ("+t('taskOverdue')+")",cls:"over"};
  if(diff===0)return{txt:t('taskToday'),cls:"today"};
  return{txt:txt,cls:""};
}
/* 시간순 정렬: 시간 있는 것 먼저(빠른 순) → 시간 없는 것 뒤로 */
function byTime(a,b){
  const A=a.start_time||"", B=b.start_time||"";
  if(A&&B) return A.localeCompare(B) || (a.title||"").localeCompare(b.title||"");
  if(A) return -1; if(B) return 1;
  return (a.title||"").localeCompare(b.title||"");
}
/* 리스트용: 마감일 순 → 같은 날이면 시간 순 */
function byDueTime(a,b){
  const A=a.due_date||"9999-99-99", B=b.due_date||"9999-99-99";
  if(A!==B) return A.localeCompare(B);
  return byTime(a,b);
}

function recentMonths(n){const a=[],d=new Date();for(let i=0;i<n;i++){a.push(new Date(d.getFullYear(),d.getMonth()-i,1).toISOString().slice(0,7));}return a;}
/* 고정비 그 달 금액.
 *  - is_locked!==false (고정 ON): 기본금액. 단 그 달 오버라이드 있으면 그 값(그달만 예외).
 *  - is_locked===false (고정 OFF, 예: 급여): 그 달 직접 입력값(오버라이드)만. 없으면 0. */
function fixAmtOf(item,m){
  const o=fixedOv.find(x=>String(x.item_id)===String(item.id)&&x.month===m);
  if(item.is_locked===false) return o?Number(o.amount):0;
  return o?Number(o.amount):Number(item.amount||0);
}
function fixedSum(m){return fixedItems.filter(x=>x.active!==false).reduce((s,x)=>s+fixAmtOf(x,m),0);}
function expSum(m){return expenses.filter(e=>e.spend_date&&e.spend_date.slice(0,7)===m).reduce((s,e)=>s+Number(e.amount||0),0);}

function renderProfit(){
  const sumBy=(arr,m)=>arr.filter(o=>o.order_date&&(m==="ALL"||o.order_date.slice(0,7)===m)).reduce((s,o)=>s+Number(o.total_shitadai||0),0);
  const orderMonths=[...new Set(salesOrders.concat(orders).filter(o=>o.order_date).map(o=>o.order_date.slice(0,7)))];
  const expMonths=expenses.filter(e=>e.spend_date).map(e=>e.spend_date.slice(0,7));
  const allMonths=[...new Set(orderMonths.concat(expMonths).concat([fMonth]))];
  // ★ 고정비는 '장사한 달'(매출 or 사입이 있는 달)에만 계상. 빈 달엔 0.
  const activeMonth=ym=>(sumBy(salesOrders,ym)>0 || sumBy(orders,ym)>0);
  const fixedFor=ym=>activeMonth(ym)?fixedSum(ym):0;
  const md=ym=>({sales:sumBy(salesOrders,ym), buy:sumBy(orders,ym), fixed:fixedFor(ym), exp:expSum(ym)});

  // 선택된 기 기준
  const fys=availableFYs(salesOrders.concat(orders));

  fyProfit=curFY;
  const fm=fyMonths(curFY);
  // 선택 월이 이 기에 없으면 전체로
  if(selProfitMonth!=="ALL" && !fm.includes(selProfitMonth)) selProfitMonth="ALL";

  // 카드 대상 월 목록: 전체=기 12개월, 특정월=그 달만
  const cardMonths = selProfitMonth==="ALL" ? fm : [selProfitMonth];
  const tS=cardMonths.reduce((s,m)=>s+sumBy(salesOrders,m),0);
  const tB=cardMonths.reduce((s,m)=>s+sumBy(orders,m),0);

  const tE=cardMonths.reduce((s,m)=>s+expSum(m),0);
  const gross=tS-tB;                 // 粗利益(매출총이익) = 매출 − 사입
  const tP=tS-tB-tF-tE;              // 순이익(영업이익)
  const rate=tS?Math.round(tP/tS*1000)/10:0;
  const grate=tS?Math.round(gross/tS*1000)/10:0;
  const neg=v=>v<0?' style="color:#C0392B"':'';
  const cardLabel = selProfitMonth==="ALL" ? fyLabel(curFY) : monthFull(selProfitMonth);

  const tabs=fys.map(fy=>`<button class="fytab ${fy===curFY?'on':''}" data-fyprofit="${fy}">${fyLabel(fy)}<span class="fyr">${fyRange(fy)}</span></button>`).join("");

    +fm.map(m=>{const has=sumBy(salesOrders,m)>0||sumBy(orders,m)>0;return `<button class="mtab ${m===selProfitMonth?'on':''}" data-pm="${m}">${monthLabel(m)}<span class="pay">${has?'':t('pNoData').slice(0,0)}${m.split("-")[0]}</span></button>`;}).join("")
    +`</div>`;

  $("view").innerHTML=`
    <div class="page-head"><div class="ttl"><div><h1>${META.profit.label[lang]}</h1><p class="sub">${t('profitSub')}</p></div>
      <div class="head-right"><button class="refresh ${buyBusy?'busy':''}" id="pRefresh"><span class="sp"></span>${t('refresh')}</button></div></div></div>
    ${buyErr?`<div class="banner err">${t('buyErr')}</div>`:""}
    ${!allMonths.length?`<div class="empty" style="border-radius:14px">${t('pNoData')}</div>`:`
    <div class="fytabs" style="margin-bottom:12px">${tabs}</div>
    ${monTabs}
    <div class="pcards">
      <div class="pcard s"><div class="pl">${cardLabel} · ${t('pSales')}</div><div class="pv">${yen(tS)}</div></div>
      <div class="pcard b"><div class="pl">${t('pCost')}</div><div class="pv">${yen(tB+tF+tE)}</div>
        <div class="pr">${t('pBuy')} ${yen(tB)} · ${t('pFixed')} ${yen(tF)} · ${t('pExp')} ${yen(tE)}</div></div>
      <div class="pcard"><div class="pl">${t('pGross')}</div><div class="pv"${neg(gross)}>${yen(gross)}</div><div class="pr">${t('pRate')} ${grate}%</div></div>
      <div class="pcard p"><div class="pl">${t('pProfit')}</div><div class="pv"${neg(tP)}>${yen(tP)}</div><div class="pr">${t('pRate')} ${rate}%</div></div>
    </div>
    <div class="fycard" style="padding-bottom:18px">
      <div class="fyhead" style="margin-bottom:14px"><span class="fyt">${fyLabel(curFY)} · ${lang==='ja'?'月別損益（万円）':'월별 손익 (만엔)'}</span></div>

      </div>
    </div>
    `}`;
  $("pRefresh").onclick=()=>{fetchOrders();fetchCosts();};
  document.querySelectorAll("[data-fyprofit]").forEach(b=>b.onclick=()=>{fyProfit=Number(b.dataset.fyprofit);selProfitMonth="ALL";renderProfit();});
  document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{selProfitMonth=b.dataset.pm;renderProfit();});
}

/* ============ 입금관리 (미수금) ============ */
/* 청구 단위 = 거래처 × 매출월. 입금 예정일 = 익월 말일. 수동 체크. */
let deposits=[], depErr=false, depNoTbl=false, depBusy=false, selDue="ALL";

const dueDateOf=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm+1,0);}; // 익월 말일
const dueKeyOf=m=>{const[y,mm]=m.split("-").map(Number);let ny=y,nm=mm+1;if(nm>12){nm=1;ny++;}return ny+"-"+String(nm).padStart(2,"0");};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};

async function fetchDeposits(){
  depBusy=true;const rb=$("depRefresh");if(rb)rb.classList.add("busy");
  try{
    const res=await fetch(SUPA_URL+"/rest/v1/deposits?select=*",{headers:H});
    const d=await res.json();
    if(!Array.isArray(d)){depNoTbl=true;deposits=[];}
    else{deposits=d;depNoTbl=false;}
    depErr=false;
  }catch(e){depErr=true;}
  depBusy=false;if(current==="deposit")renderDeposit();renderNav();
}

/* salesOrders → 거래처×매출월 청구 목록 */
function billList(){
  const g={};
  salesOrders.forEach(o=>{
    if(!o.order_date)return;
    const m=o.order_date.slice(0,7), k=o.client_id+"|"+m;
    if(!g[k])g[k]={cid:o.client_id,month:m,amt:0,cnt:0,nos:[]};
    g[k].amt+=Number(o.total_shitadai||0);g[k].cnt++;g[k].nos.push({no:o.order_no,id:o.id});
  });
  const today=dayStart();
  return Object.values(g).map(b=>{
    const rec=deposits.find(d=>String(d.client_id)===String(b.cid)&&d.month===b.month);
    const due=dueDateOf(b.month);
    const paid=!!(rec&&rec.paid);
    return Object.assign(b,{
      name:(clientMap[b.cid]||{}).name||("#"+b.cid),
      code:(clientMap[b.cid]||{}).code||"",
      due:due, dueKey:dueKeyOf(b.month), paid:paid,
      paidDate:rec?rec.paid_date:null,
      state: paid?"paid":(due<today?"over":"pend"),
      dleft: Math.ceil((due-today)/86400000)
    });
  }).sort((a,b)=>a.due-b.due||b.amt-a.amt);
}

async function setPaid(cid,month,paid){
  const b=deposits.find(d=>String(d.client_id)===String(cid)&&d.month===month);
  if(b){b.paid=paid;b.paid_date=paid?ymd(new Date()):null;}
  else deposits.push({client_id:String(cid),month:month,paid:paid,paid_date:paid?ymd(new Date()):null});
  renderDeposit();
  try{
    await fetch(SUPA_URL+"/rest/v1/deposits?on_conflict=client_id,month",{
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},H),
      body:JSON.stringify({client_id:String(cid),month:month,paid:paid,paid_date:paid?ymd(new Date()):null})
    });
  }catch(e){}
  await fetchDeposits();
}

/* Open-Meteo — API 키 불필요. 신주쿠 좌표 고정 */
let fx=null, fxErr=false;
/* JPY→KRW 실시간 환율. Frankfurter(ECB, 무료·무키). 100엔 기준 + 전일대비 등락. */
async function fetchFx(){
  // 여러 무료 소스를 순서대로 시도 (하나 막혀도 다음으로)
  const sources=[
    // 1) Frankfurter (ECB)
    async()=>{
      const r=await fetch("https://api.frankfurter.app/latest?from=JPY&to=KRW");
      const d=await r.json(); if(!d?.rates?.KRW)throw 0;
      let prev=null;
      try{const rr=await fetch("https://api.frankfurter.app/"+shiftYmd(d.date,-7)+".."+d.date+"?from=JPY&to=KRW");
        const dd=await rr.json();const k=Object.keys(dd.rates||{}).sort();
        if(k.length>=2)prev=dd.rates[k[k.length-2]].KRW*100;}catch(e){}
      return {krw:d.rates.KRW*100, date:d.date, prev};
    },
    // 2) open.er-api.com (무료·무키)
    async()=>{
      const r=await fetch("https://open.er-api.com/v6/latest/JPY");
      const d=await r.json(); if(!d?.rates?.KRW)throw 0;
      return {krw:d.rates.KRW*100, date:(d.time_last_update_utc||"").slice(0,16)||"", prev:null};
    },
    // 3) jsdelivr 환율 데이터 (무료·무키, CDN)
    async()=>{
      const r=await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json");
      const d=await r.json(); const v=d?.jpy?.krw; if(!v)throw 0;
      return {krw:v*100, date:d.date||"", prev:null};
    },
  ];
  fxErr=true;
  for(const src of sources){
    try{
      const res=await src();
      fx={krw:res.krw, date:res.date, prev:res.prev, diff:res.prev?res.krw-res.prev:0};
      fxErr=false; break;
    }catch(e){}
  }
  renderFx();
}
function shiftYmd(ymd,days){const dt=new Date(ymd+"T00:00:00Z");dt.setUTCDate(dt.getUTCDate()+days);return dt.toISOString().slice(0,10);}
let fxAmt=1000000;   // 계산기 입력 엔 금액 (기본 100만엔)
function renderFx(){
  const el=$("cpFx");if(!el)return;
  if(fxErr||!fx){el.className="cp-fx err";el.innerHTML=`<div class="fxi">💱</div><div class="fxmain"><div class="fxsub">${t('fxErr')}</div></div><button class="fxretry" id="fxRetry">${lang==='ja'?'再試行':'다시'}</button>`;
    const rb=$("fxRetry"); if(rb)rb.onclick=()=>{el.innerHTML=`<div class="fxi">💱</div><div class="fxmain"><div class="fxsub">…</div></div>`;fetchFx();};
    return;}
  el.className="cp-fx col";
  const rate=fx.krw/100;   // 1엔당 원
  const per100=fx.krw.toLocaleString("ko-KR",{maximumFractionDigits:2});
  let chg="";
  if(fx.prev){
    const up=fx.diff>=0, pct=(fx.diff/fx.prev*100);
    chg=`<span class="fxchg ${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(fx.diff).toFixed(1)} (${up?'+':''}${pct.toFixed(2)}%)</span>`;
  }
  const won=Math.round(fxAmt*rate);
  const wonMan = won>=10000 ? (lang==='ja'?`約 ${man(won)}万`:`약 ${man(won)}만`) : "";
  el.innerHTML=`
    <div class="fx-top"><span class="fx-i">💱</span>
      <span class="fx-r">100${t('fxYen')} = <b>${per100}</b> ${t('fxWon')}</span>${chg}</div>
    <div class="fx-calc">
      <div class="fx-in"><input id="fxInput" type="text" inputmode="numeric" value="${fxAmt.toLocaleString("ja-JP")}" /><span class="u">${t('fxYen')}</span></div>
      <span class="fx-arrow">↓</span>
      <div class="fx-out"><b id="fxOut">${won.toLocaleString("ko-KR")}</b><span class="u">${t('fxWon')}</span></div>
    </div>
    <div class="fx-note"><span id="fxOutMan">${wonMan}</span> · ${t('fxMkt')} · ${fx.date} ${lang==='ja'?'基準':'기준'}</div>`;
  const inp=$("fxInput");
  if(inp) inp.oninput=()=>{
    const n=Number(inp.value.replace(/[^\d]/g,""))||0;
    fxAmt=n;
    const w=Math.round(n*(fx.krw/100));
    const o=$("fxOut"); if(o)o.textContent=w.toLocaleString("ko-KR");
    const om=$("fxOutMan"); if(om)om.textContent = w>=10000 ? (lang==='ja'?`約 ${man(w)}万`:`약 ${man(w)}만`) : "";
    inp.value=n.toLocaleString("ja-JP");
  };
}

async function fetchWx(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude=35.7015&longitude=139.7003&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1";
    const res=await fetch(u);const d=await res.json();
    if(!d||!d.current)throw 0;
    wx={temp:Math.round(d.current.temperature_2m),code:d.current.weather_code,
        hi:Math.round(d.daily.temperature_2m_max[0]),lo:Math.round(d.daily.temperature_2m_min[0])};
    wxErr=false;
  }catch(e){wxErr=true;}
  renderWx();
}
function wxIcon(c){
  if(c===0)return"☀️"; if(c===1)return"🌤️"; if(c===2)return"⛅"; if(c===3)return"☁️";
  if(c>=45&&c<=48)return"🌫️"; if(c>=51&&c<=57)return"🌦️"; if(c>=61&&c<=67)return"🌧️";
  if(c>=71&&c<=77)return"❄️"; if(c>=80&&c<=82)return"🌦️"; if(c>=85&&c<=86)return"🌨️";
  if(c>=95)return"⛈️"; return"🌡️";
}
function wxLabel(c){
  if(c===0)return t('wx0'); if(c===1)return t('wx1'); if(c===2)return t('wx2'); if(c===3)return t('wx3');
  if(c>=45&&c<=48)return t('wx45'); if(c>=51&&c<=57)return t('wx51'); if(c>=61&&c<=67)return t('wx61');
  if(c>=71&&c<=77)return t('wx71'); if(c>=80&&c<=86)return t('wx80'); if(c>=95)return t('wx95');
  return "-";
}
function renderWx(){
  const el=$("cpWx");if(!el)return;
  if(wxErr||!wx){el.className="cp-wx err";el.innerHTML=`<div class="wi">🌡️</div><div><div class="wd">${t('wxErr')}</div><div class="wc">${t('wxCity')}</div></div>`;return;}
  el.className="cp-wx";
  el.innerHTML=`<div class="wi">${wxIcon(wx.code)}</div><div><div class="wt">${wx.temp}°</div>`
    +`<div class="wd">${wxLabel(wx.code)} · ${wx.hi}° / ${wx.lo}°</div>`
    +`<div class="wc">${t('wxCity')}</div></div>`;
}

/* 회계연도 기 탭 + 그 기의 12개월(10~9월) 탭 공용 생성.
 * sel=현재 선택월(YYYY-MM), selFY=선택된 기, mAttr/fyAttr=클릭용 data속성.
 * 반환 {html, month, fy} — month/fy는 보정된 현재값. */
function fyMonthTabs(sel, selFY, mAttr, fyAttr){
  const baseYM=(sel&&/^\d{4}-\d{2}$/.test(sel))?sel:ymd(new Date()).slice(0,7);
  const curFY = selFY || fyOf(baseYM);
  const fmList=fyMonths(curFY);
  let month=sel;
  if(!fmList.includes(month)){ const today=ymd(new Date()).slice(0,7); month=fmList.includes(today)?today:fmList[0]; }
  const fys=[...new Set([fyOf(baseYM), fyOf(ymd(new Date()).slice(0,7)), 1])].sort((a,b)=>b-a);
  const fyTabs=fys.map(fy=>`<button class="fytab ${fy===curFY?'on':''}" ${fyAttr}="${fy}">${fyLabel(fy)}<span class="fyr">${fyRange(fy)}</span></button>`).join("");
  const monTabs=fmList.map(m=>`<button class="mtab ${m===month?'on':''}" ${mAttr}="${m}">${monthLabel(m)}<span class="pay">${m.split("-")[0]}</span></button>`).join("");
  return {month, fy:curFY, html:`<div class="fytabs" style="margin-bottom:14px">${fyTabs}</div><div class="months compact">${monTabs}</div>`};
}
function monthTabsHtml(sel,attr){
  return `<div class="months">`+recentMonths(6).map(m=>`<button class="mtab ${m===sel?'on':''}" ${attr}="${m}">${monthLabel(m)}<span class="pay">${m.split("-")[0]}</span></button>`).join("")+`</div>`;
}

function renderTasks(){
  const byWho=x=>todoWho==="전체"||(x.assignee||"미배정")===todoWho;
  const open=todos.filter(x=>x.status!=="done"&&byWho(x)).sort(byDueTime);
  const done=todos.filter(x=>x.status==="done"&&byWho(x)).sort(byDueTime);
  const pills=["전체",...cfg.members].map(m=>`<button class="pill ${todoWho===m?"on":""}" data-tw="${m}">${m==="전체"?t('all'):m}</button>`).join("");
  const opts=cfg.members.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");
  const trow=x=>{const di=dueInfo(x.due_date);const isDone=x.status==="done";const tr=timeRange(x);
    return `<div class="trow ${isDone?'done':''}">
      <button class="tcheck" data-tg="${x.id}|${isDone?'open':'done'}">${isDone?I.check:''}</button>
      <div class="tbody tedit" data-edit="${x.id}"><div class="ttitle">${esc(x.title)}</div>
        <div class="tmeta">${x.assignee?`<span class="tasg" style="color:${asgColor(x.assignee)};background:${asgColor(x.assignee)}1a">${esc(x.assignee)}</span>`:""}<span class="tdue ${isDone?'':di.cls}">${di.txt}</span>${tr?`<span class="ttime">${esc(tr)}</span>`:""}</div></div>
      <button class="tdel" data-td="${x.id}" title="${t('taskDel')}">${I.trash}</button></div>`;};

  const viewToggle=`<div class="langtoggle" style="margin:0"><button class="${taskView==='cal'?'on':''}" data-tv="cal">${t('viewCal')}</button><button class="${taskView==='list'?'on':''}" data-tv="list">${t('viewList')}</button></div>`;

  let mainHtml;
  if(taskView==="cal"){
    mainHtml=calendarHtml(byWho);
  }else{
    mainHtml=`
    <div class="list-head todo"><span class="dot"></span><span class="name">${t('taskOpen')}</span><span class="count">${open.length}</span></div>
    <div style="margin-bottom:22px">${open.length?open.map(trow).join(""):`<div class="empty">${t('taskNoOpen')}</div>`}</div>
    <div class="list-head done"><span class="dot"></span><span class="name">${t('taskDone')}</span><span class="count">${done.length}</span>
      <button class="toggle-done" id="tToggle">${todoShowDone?t('hide'):t('show')}</button></div>
    <div>${!todoShowDone?`<div class="empty">${t('hide')} · ${done.length}</div>`:(done.length?done.map(trow).join(""):`<div class="empty">${t('taskNoDone')}</div>`)}</div>`;
  }

  $("view").innerHTML=`
    <div class="page-head"><div class="ttl"><div><h1>${META.tasks.label[lang]}</h1><p class="sub">${t('tasksSub')}</p></div>
      <div class="head-right">${viewToggle}<button class="refresh ${todoBusy?'busy':''}" id="todoRefresh"><span class="sp"></span>${t('refresh')}</button></div></div></div>
    ${todoErr?`<div class="banner err">${t('taskErr')}</div>`:""}
    <div class="taskadd">
      <input type="text" id="tTitle" placeholder="${t('taskPh')}" />
      <select id="tAsg"><option value="">${t('unassigned')}</option>${opts}</select>
      <input type="date" id="tDue" />
      <input type="time" id="tStart" title="${t('tStart')}" />
      <span class="tsep">~</span>
      <input type="time" id="tEnd" title="${t('tEnd')}" />
      <button class="go" id="tAdd">${t('taskAdd')}</button>
    </div>
    <div class="filters">${pills}</div>
    ${mainHtml}`;

  $("todoRefresh").onclick=fetchTodos;
  const tt=$("tToggle");if(tt)tt.onclick=()=>{todoShowDone=!todoShowDone;renderTasks();};
  const add=()=>{const v=$("tTitle").value.trim();if(!v)return;addTodo(v,$("tAsg").value,$("tDue").value,$("tStart").value,$("tEnd").value);};
  $("tAdd").onclick=add;
  $("tTitle").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
  document.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{taskView=b.dataset.tv;renderTasks();});
  document.querySelectorAll("[data-tw]").forEach(b=>b.onclick=()=>{todoWho=b.dataset.tw;renderTasks();});
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const[id,st]=b.dataset.tg.split("|");setTodo(id,st);});
  document.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>delTodo(b.dataset.td));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();openEditTodo(b.dataset.edit);});
  // 캘린더 이벤트
  const pv=$("calPrev"),nx=$("calNext"),td=$("calToday");
  if(pv)pv.onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderTasks();};
  if(nx)nx.onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderTasks();};
  if(td)td.onclick=()=>{const n=new Date();calY=n.getFullYear();calM=n.getMonth();renderTasks();};
  document.querySelectorAll("[data-cell]").forEach(c=>c.onclick=()=>{$("tDue").value=c.dataset.cell;$("tTitle").focus();});
}

function calendarHtml(byWho){
  const first=new Date(calY,calM,1);
  const start=new Date(first);start.setDate(1-first.getDay()); // 그 주 일요일부터
  const todayStr=(new Date()).toISOString().slice(0,10);
  const monthLbl=lang==="ja"?`${calY}年 ${calM+1}月`:`${calY}년 ${calM+1}월`;
  const wds=[0,1,2,3,4,5,6].map(i=>`<div>${t('wd'+i)}</div>`).join("");
  // 날짜별 할 일 모으기
  const map={};
  todos.filter(byWho).forEach(x=>{if(x.due_date){(map[x.due_date]=map[x.due_date]||[]).push(x);}});
  Object.keys(map).forEach(k=>map[k].sort(byTime));   // ← 넣은 순서 무시하고 시간순으로
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const out=d.getMonth()!==calM;
    const isToday=ds===todayStr;
    const items=(map[ds]||[]);
    const evs=items.slice(0,3).map(x=>{const tr=timeRange(x);return `<div class="cev ${x.status==="done"?'done':''}" data-edit="${x.id}" style="background:${asgColor(x.assignee)}">${tr?esc(tr)+" ":""}${esc(x.title)}</div>`;}).join("");
    const more=items.length>3?`<div class="cmore">+${items.length-3}${t('calMore')}</div>`:"";
    const hol=HOLIDAYS[ds]||{};
    const holHtml=(hol.jp?`<span class="chol jp">🇯🇵 ${hol.jp}</span>`:"")+(hol.kr?`<span class="chol kr">🇰🇷 ${hol.kr}</span>`:"");
    // 학사일정: 방학 기간 배경띠 + 첫날/월초에만 라벨, 학기시작 마커
    const terms=schoolFor(ds);
    const stripes=terms.map(s=>`<span class="sstripe" style="background:${SCHOOL_COLORS[s.kind]}"></span>`).join("");
    const isDow1=d.getDate()===1;
    const schLabels=terms.filter(s=>ds===s.from||isDow1).map(s=>`<span class="schip" style="background:${SCHOOL_COLORS[s.kind]}1a;color:${SCHOOL_COLORS[s.kind]};border-color:${SCHOOL_COLORS[s.kind]}55">${s.label[lang]}</span>`).join("");
    const st=SCHOOL_STARTS[ds];
    const startLabel=st?`<span class="schip start">🎓 ${st[lang]}</span>`:"";
    cells+=`<div class="cell ${out?'out':''} ${isToday?'today':''} ${(hol.jp||hol.kr)?'hol':''}" data-cell="${ds}"><span class="cdate">${d.getDate()}</span>${stripes?`<span class="sstripes">${stripes}</span>`:""}${holHtml}${startLabel}${schLabels}${evs}${more}</div>`;
  }
  // 마감일 없는 할 일
  const noDue=todos.filter(x=>byWho(x)&&!x.due_date&&x.status!=="done");
  const noDueHtml=noDue.length?`<div class="nodue"><h4>${t('noDueList')} (${noDue.length})</h4>${noDue.map(x=>`<div class="trow"><button class="tcheck" data-tg="${x.id}|done"></button><div class="tbody"><div class="ttitle">${esc(x.title)}</div><div class="tmeta">${x.assignee?`<span class="tasg" style="color:${asgColor(x.assignee)};background:${asgColor(x.assignee)}1a">${esc(x.assignee)}</span>`:""}</div></div><button class="tdel" data-td="${x.id}">${I.trash}</button></div>`).join("")}</div>`:"";
  return `<div class="calbar"><button class="navb" id="calPrev">‹</button><span class="mlabel">${monthLbl}</span><button class="navb" id="calNext">›</button><button class="today" id="calToday">${t('taskToday')}</button></div>
    <div class="calgrid"><div class="calhead">${wds}</div><div class="calbody">${cells}</div></div>
    <div class="schlegend">
      <span><i style="background:#E8892B"></i>${lang==='ja'?'夏休み':'여름방학'}</span>
      <span><i style="background:#3B82C4"></i>${lang==='ja'?'冬休み':'겨울방학'}</span>
      <span><i style="background:#5AA469"></i>${lang==='ja'?'春休み':'봄방학'}</span>
      <span><i style="background:#8B5CF6"></i>${lang==='ja'?'大学（夏·春）':'대학(여름·봄)'}</span>
      <span><i style="background:#1E4D3A"></i>🎓 ${lang==='ja'?'学期開始':'학기 시작'}</span>
      <span class="schnote">${lang==='ja'?'※ 東京公立の目安。学校により異なります':'※ 도쿄 공립 기준. 학교마다 다름'}</span>
    </div>${noDueHtml}`;
}

  }
  const nf=$("newFld");
  if(nf)nf.onclick=()=>{
    $("confirmBox").className="confirm";$("confirmBox").innerHTML=`<h3>${t('newFolder')}</h3>
      <div class="efield"><label>${t('folderPh')}</label><input id="nfName" type="text" placeholder="${t('folderPh')}"/></div>
      <div class="confirm-actions"><button class="cancel" id="nfCancel">${t('cancelBtn')}</button><button class="danger" id="nfOk" style="background:var(--kd);border-color:var(--kd)">${t('add')}</button></div>`;
    $("overlay").classList.add("show");$("nfName").focus();
    $("nfCancel").onclick=()=>$("overlay").classList.remove("show");
    const go=()=>{const v=$("nfName").value.trim();if(!v)return;$("overlay").classList.remove("show");addFolder(section,v);};
    $("nfOk").onclick=go;$("nfName").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  };
  const bk=$("fBack");if(bk)bk.onclick=()=>{selFolder[section]="all";renderFiles();};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{selFolder[section]=b.dataset.f;renderFiles();});
  document.querySelectorAll("[data-delf]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.delf;confirmDialog(t('delFolderTitle'),t('delFolderDesc'),"",()=>removeFolder(id));});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>window.open(fileUrl(b.dataset.open),"_blank"));
  document.querySelectorAll("[data-delx]").forEach(b=>b.onclick=()=>{const[id,path]=b.dataset.delx.split("|");const f=filesList.find(x=>x.id==id);confirmDialog(t('delFileTitle'),t('delFileDesc'),f?f.name:"",()=>removeFile(id,path));});
}
function renderPlaceholder(id){const m=META[id];$("view").innerHTML=`<div class="page-head"><div class="ttl"><div><h1>${m.label[lang]}</h1><p class="sub">${t('beforeMake')}</p></div></div></div><div class="placeholder"><div class="pic">${I[m.icon]}</div><h2>${m.label[lang]}</h2><p>${m.desc[lang]}</p><div class="soonpill">${t('soonBig')}</div></div>`;}
function renderSettings(){
  $("view").innerHTML=`<div class="page-head"><div class="ttl"><div><h1>${META.settings.label[lang]}</h1><p class="sub">${t('setSub')}</p></div></div></div>
    <div class="scard"><h3>${t('linksSet')}</h3><p class="hint">${t('linksHint')}</p><div id="linkList"></div>
      <div class="addrow2"><input class="n" id="newLinkName" placeholder="${t('linkNamePh')}"/><input class="u" id="newLinkUrl" placeholder="${t('linkUrlPh')}"/><button id="addLink">${t('linkAdd')}</button></div></div>
    <div class="scard"><h3>${t('members')}</h3><p class="hint">${t('membersHint')}</p><div id="memberList"></div>
      <div class="addrow"><input id="newMember" placeholder="${t('memberPh')}"/><button id="addMember">${t('add')}</button></div></div>
    <div class="scard"><h3>${t('rules')}</h3><p class="hint">${t('rulesHint')}</p><div id="ruleList"></div></div>`;
  fillSettings();
  $("addMember").onclick=async ()=>{const v=$("newMember").value.trim();if(!v)return;if(!cfg.members.includes(v))cfg.members.push(v);await saveCfg(cfg);renderSettings();};
  $("newMember").addEventListener("keydown",e=>{if(e.key==="Enter")$("addMember").click();});
  const addL=async ()=>{
    const n=$("newLinkName").value.trim(), u=$("newLinkUrl").value.trim();
    if(!n||!u)return;
    cfg.links=cfg.links||[];cfg.links.push({name:n,url:u});
    await saveCfg(cfg);renderSettings();renderNav();
  };
  $("addLink").onclick=addL;
  ["newLinkName","newLinkUrl"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")addL();}));
  fillLinks();
}
function fillLinks(){
  const el=$("linkList");if(!el)return;
  const ls=cfg.links||[];
  el.innerHTML=ls.length? ls.map((l,i)=>`<div class="lrow">
      <img src="${esc(favOf(l.url))}" onerror="this.style.visibility='hidden'"/>
      <span class="ln">${esc(l.name)}</span><span class="lu">${esc(normUrl(l.url))}</span>
      <button class="lmv" data-up="${i}" ${i===0?"disabled":""}>↑</button>
      <button class="lmv" data-dn="${i}" ${i===ls.length-1?"disabled":""}>↓</button>
      <button class="del" data-dell="${i}">${I.xmark}</button></div>`).join("")
    : `<p class="hint">${t('linkNone')}</p>`;
  const mv=async(i,j)=>{const a=cfg.links;[a[i],a[j]]=[a[j],a[i]];await saveCfg(cfg);renderSettings();renderNav();};
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1));
  el.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>mv(+b.dataset.dn,+b.dataset.dn+1));
  el.querySelectorAll("[data-dell]").forEach(b=>b.onclick=async ()=>{
    cfg.links.splice(+b.dataset.dell,1);await saveCfg(cfg);renderSettings();renderNav();});
}
function fillSettings(){
  const ml=$("memberList");if(!ml)return;
  ml.innerHTML=cfg.members.map(m=>`<div class="row"><span class="lab">${m}</span><button class="del" data-delm="${m}">×</button></div>`).join("")||`<p class="hint">${t('noMembers')}</p>`;
  ml.querySelectorAll("[data-delm]").forEach(b=>b.onclick=async ()=>{const m=b.dataset.delm;cfg.members=cfg.members.filter(x=>x!==m);await saveCfg(cfg);renderSettings();});
  const rl=$("ruleList");
  rl.innerHTML=Object.keys(cfg.rules).map(x=>`<div class="row"><span class="typetag">${typeLabel(x)}</span><span class="assignee">${asgLabel(cfg.rules[x])}</span></div>`).join("")||`<p class="hint">${t('noRules')}</p>`;
}

(async function(){
  cfg=await loadCfg();lang=cfg.lang||"ko";
  renderAll();fetchMails();fetchOrders();fetchTodos();fetchFiles();fetchMeetings();fetchCosts();fetchChecks();fetchWx();fetchFx();fetchDeposits();
  $("cpInput").addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    const v=e.target.value.trim();if(!v)return;
    e.target.value="";addCheck(v);
  });
  setInterval(fetchChecks,120000);
  setInterval(fetchWx,900000);
  setInterval(fetchFx,600000);
  setInterval(renderCpDate,60000);

  // 그래프 hover 툴팁 (이벤트 위임 — 그래프가 다시 그려져도 작동)
  (function(){
    const tip=$("chartTip");
    document.addEventListener("mouseover",e=>{
      const g=e.target.closest&&e.target.closest(".hbar");
      if(!g||!tip)return;
      tip.textContent=(g.getAttribute("data-tip")||"").replace(/｜/g,"\n");
      tip.classList.add("on");
    });
    document.addEventListener("mousemove",e=>{
      if(!tip||!tip.classList.contains("on"))return;
      let x=e.clientX+14, y=e.clientY+14;
      const w=tip.offsetWidth, h=tip.offsetHeight;
      if(x+w>window.innerWidth-10) x=e.clientX-w-14;
      if(y+h>window.innerHeight-10) y=e.clientY-h-14;
      tip.style.left=x+"px"; tip.style.top=y+"px";
    });
    document.addEventListener("mouseout",e=>{
      const g=e.target.closest&&e.target.closest(".hbar");
      if(g&&tip)tip.classList.remove("on");
    });
  })();
  document.querySelectorAll("[data-lang-btn]").forEach(b=>b.onclick=()=>{lang=b.dataset.langBtn;cfg.lang=lang;saveCfg(cfg);renderAll();});
  $("hamb").onclick=()=>$("sidebar").classList.toggle("open");
  setInterval(()=>{if(current==="mail")fetchMails();},60000);
  setInterval(fetchOrders,180000);
  window.addEventListener("focus",()=>{if(current==="mail")fetchMails();});
})();
</script>
