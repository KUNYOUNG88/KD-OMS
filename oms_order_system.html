<style>
:root{
  --navy:#00704a; --navy2:#005c3d; --ink:#1e3932; --muted:#6b7d75;
  --line:#dfe7e3; --line2:#eef3f1; --bg:#f4f1e9; --card:#ffffff;
  --teal:#1e3932; --teal-d:#132a24; --amber:#cba258; --red:#e10500;
  --blue:#1b6a5a; --chip:#e3f1eb; --brand:#00704a; --flame:#1e3932;
  --shadow:0 1px 2px rgba(30,57,50,.06),0 2px 10px rgba(30,57,50,.10);
  --shadow-lg:0 8px 28px rgba(30,57,50,.18);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 資料 폴더 뷰 ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;transition:.15s}
.fcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--navy)}
.fcard .fi{font-size:34px;line-height:1}
.fcard .fn{font-weight:700;margin-top:8px;font-size:13.5px;word-break:break-all}
.fcard .fc{font-size:11.5px;color:var(--muted);margin-top:2px}
.dchip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:#eef3f1;color:var(--muted);margin-right:4px;margin-top:3px}
.dchip.all{background:#e3f1eb;color:var(--teal-d)}
.ntc-list{display:flex;flex-direction:column;gap:12px}
.ntc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:16px 20px;transition:box-shadow .15s,transform .12s}
.ntc:hover{box-shadow:0 6px 20px rgba(19,42,36,.08);transform:translateY(-1px)}
.ntc.pin{background:linear-gradient(180deg,#fbfdfc,#fff)}
.ntc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.ntc-cat{font-size:11px;font-weight:800;padding:3px 11px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.ntc-pinbadge{font-size:11px;font-weight:800;color:#9a6b12}
.ntc-date{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.ntc-title{font-weight:800;font-size:15.5px;color:var(--ink);line-height:1.35;margin-bottom:6px;letter-spacing:-.01em}
.ntc-body{font-size:13px;color:#41504a;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ntc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2);font-size:12px}
.ntc-auds{display:flex;gap:5px;flex-wrap:wrap;margin-right:auto}
.ntc-aud{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef3f1;color:var(--muted)}
.ntc-aud.all{background:#e3f1eb;color:var(--teal-d)}
.crumb{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:13.5px;flex-wrap:wrap}

/* ---------- 로그인/설정 화면 ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 120% at 50% 0%,#eaf3ef 0%,#f4f1e9 55%)}
.gate-card{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 38px 34px;box-shadow:0 24px 60px rgba(30,57,50,.16),0 2px 8px rgba(30,57,50,.06);overflow:hidden}
.gate-card:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1e3932,#00704a 55%,#cba258)}

.gate-logo .klogo{width:70px;height:72px}
.topbar .logo .klogo{width:54px;height:56px}
.gate-logo{font-weight:800;font-size:22px;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate-logo span{color:var(--ink)}
.gate-logo .bmk{width:66px;height:66px;font-size:22px;box-shadow:0 6px 18px rgba(0,112,74,.30)}
.gate-logo .bnm{font-size:23px;letter-spacing:.16em}
.gate-logo .bmk,.topbar .logo .bmk{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,112,74,.28)}
.gate-logo .bnm,.topbar .logo .bnm{color:var(--ink);font-weight:800;letter-spacing:.06em}
.topbar .logo .blogo{height:52px;max-width:220px;object-fit:contain;display:block}
.topbar .logo .bdiv{width:1px;height:26px;background:var(--line);flex:0 0 auto}
.topbar .logo .bsub{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.gate-sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 30px;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1px solid #b0b0b0;border-radius:10px;background:#fff;font-size:15px}
.field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;
  border-radius:999px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;transition:.18s;letter-spacing:-.01em}
.btn:hover{background:var(--navy2)}
.btn.full{width:100%}
.btn.teal{background:var(--teal)} .btn.teal:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#f4f1e9;border-color:var(--ink)}
.btn.sm{padding:8px 15px;font-size:13.5px;border-radius:999px}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--line)} .btn.danger:hover{background:#f7edea;border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gate-err{background:#eef7f4;color:var(--red);font-size:13px;padding:11px 13px;border-radius:10px;margin-bottom:16px;border:1px solid #f3d6cf}
.gate-foot{margin-top:20px;text-align:center;font-size:12.5px;color:var(--muted)}
.gate-foot a{color:var(--ink);cursor:pointer;text-decoration:underline;font-weight:600}

/* ---------- 앱 레이아웃 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:#fff;color:var(--ink);display:flex;align-items:center;
  gap:14px;padding:0 24px;height:78px;border-bottom:1px solid var(--line2)}
.topbar .logo{font-weight:800;letter-spacing:.02em;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:9px}
.topbar .logo .bmk{width:52px;height:52px;font-size:17px;box-shadow:none}
.topbar .logo span{color:var(--ink)}
.topbar .spacer{flex:1}
.topbar .who{font-size:13px;text-align:right;line-height:1.3}
.topbar .who b{display:block;font-weight:700}
.topbar .who small{color:var(--muted)}
.lang-toggle{display:flex;background:#f2f2f2;border-radius:20px;overflow:hidden;padding:2px}
.lang-toggle button{padding:6px 12px;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:18px}
.lang-toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.icon-btn{color:var(--muted);padding:9px;border-radius:50%}
.icon-btn:hover{background:#f2f2f2;color:var(--ink)}

.tabs{background:#fff;border-bottom:1px solid var(--line2);position:sticky;top:64px;z-index:40;
  display:flex;gap:6px;padding:0 20px;overflow-x:auto}
.tabs button{padding:16px 12px;font-weight:600;font-size:14.5px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:-.01em;position:relative}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.tab-badge{position:absolute;top:9px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:#e0245e;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 0 rgba(255,56,92,.55);animation:badgePulse 1.6s infinite}
@keyframes badgePulse{0%{box-shadow:0 0 0 0 rgba(255,56,92,.55)}70%{box-shadow:0 0 0 7px rgba(255,56,92,0)}100%{box-shadow:0 0 0 0 rgba(255,56,92,0)}}
.tabs button:hover{color:var(--ink)}

.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 80px}
.page-title{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:-.02em}
.page-desc{color:var(--muted);font-size:14px;margin-bottom:22px}

.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:none}
.card-pad{padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}

/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;box-shadow:none}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:800;margin-top:4px;color:var(--ink)}
.stat .v.teal{color:var(--teal-d)} .stat .v.navy{color:var(--navy)}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* 검색/필터바 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8a9a92}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:22px;background:#fff;border:1px solid var(--line);transition:.15s;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select.sel{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px}

/* 商品グリッド */
.prod-layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;transition:.12s}
.pcard:hover{border-color:#c7d2e6;box-shadow:0 4px 14px rgba(16,24,40,.1)}
.pcard.incart{border-color:var(--teal);box-shadow:0 0 0 1.5px var(--teal) inset}
.pcat{display:inline-flex;align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.04em;
  padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--navy)}
.pm-inline{width:100%;min-width:70px;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:4px 7px;border-radius:7px;transition:border-color .12s,background .12s;cursor:text}
.pm-inline:hover{border-color:var(--line)}
.pm-inline:focus{border-color:var(--teal);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(30,57,50,.08)}
.pname{font-weight:700;font-size:13px;line-height:1.35;min-height:34px}
.pcolor{font-size:11.5px;color:var(--blue);font-weight:600}
.pjan{font-size:11px;color:#8a9a92;font-family:ui-monospace,monospace}
.pmeta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:2px}
.pprice .joudai{font-size:11px;color:var(--muted)}
.pprice .shitadai{font-weight:800;font-size:16px;color:var(--ink)}
.pprice .shitadai small{font-size:11px;color:var(--muted);font-weight:600}
.pstock{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.pstock.ok{background:#e7f6ef;color:var(--teal-d)} .pstock.low{background:#f6efdc;color:#9a7b1f}
.pstock.no{background:#fdeaea;color:var(--red)}
.pinbox{font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:34px;font-size:18px;font-weight:700;color:var(--navy);background:#f6f8fc}
.stepper button:hover{background:#e9eef7}
.stepper input{width:46px;height:34px;text-align:center;border:none;border-left:1px solid var(--line);
  border-right:1px solid var(--line);font-weight:700}
.stepper input:focus{outline:none;background:#f6f3ea}
.add-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.add-row .unit-lbl{font-size:11px;color:var(--muted);flex:1}

/* カート */
.cart{position:sticky;top:118px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.cart-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.cart-head b{font-size:15px}
.cart-head .cnt{background:var(--teal);color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px}
.cart-body{max-height:46vh;overflow-y:auto;padding:6px 0}
.cart-empty{padding:40px 20px;text-align:center;color:#8a9a92;font-size:13px}
.citem{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.citem .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.citem .det{font-size:11px;color:var(--muted);margin-top:2px}
.citem .sub{font-weight:800;font-size:13px;white-space:nowrap}
.citem .rm{color:#c2c9d6;font-size:16px;line-height:1}
.citem .rm:hover{color:var(--red)}
.cart-foot{padding:14px 16px;border-top:1px solid var(--line);background:#fbfcfe}
.cart-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted)}
.cart-total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;color:var(--ink);
  padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.cart-total b{color:var(--teal-d)}

/* テーブル */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:#fff;box-shadow:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;text-align:left;padding:13px 14px;font-weight:600;color:var(--muted);font-size:12.5px;
  white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}
.t-right{text-align:right} .t-center{text-align:center}
.badge{display:inline-flex;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px}
.badge.ord{background:#eef6f2;color:#1b6a5a}
.badge.cfm{background:#EAF2FF;color:#2563EB} .badge.shp{background:#E6F6F4;color:#008489}
.badge.cnl{background:#F2F2F2;color:#717171}
.badge.hld{background:#FDF3E0;color:#9a6b12}
.badge.new{background:#e0245e;color:#fff;box-shadow:0 0 0 0 rgba(224,36,94,.5);animation:badgePulse 1.8s infinite}
.new-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0245e;margin-right:6px;vertical-align:middle;animation:badgePulse 1.8s infinite}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:960px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head b{font-size:16px}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end;flex-wrap:nowrap;overflow-x:auto;
  position:sticky;bottom:0;background:#fff}
.modal-foot .btn{padding:9px 13px;font-size:12.5px;white-space:nowrap;flex:0 0 auto;line-height:1.2}
.modal-foot::-webkit-scrollbar{height:5px}
.modal-foot::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.fg input[type=color]{width:50px;height:38px;padding:3px;flex:0 0 auto;cursor:pointer}
.fg input[type=checkbox],.fg input[type=radio]{width:16px;height:16px;min-width:16px;flex:0 0 auto;padding:0;border:0;border-radius:0;background:none;accent-color:var(--navy)}
.dcli-row{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f4f2}
.dcli-row:last-child{border-bottom:0}
.dcli-row:hover{background:#f7faf8}
.dcli-row span{flex:1;min-width:0;text-align:left;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--blue)}

.empty{text-align:center;padding:60px 20px;color:#8a9a92}
.empty .ic{font-size:40px;margin-bottom:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;font-size:13.5px;
  z-index:200;transition:.25s;box-shadow:var(--shadow-lg);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{min-height:50vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted)}
.loading-full .spinner{border-color:#d4dae6;border-top-color:var(--navy)}

@media(max-width:880px){
  .prod-layout{grid-template-columns:1fr}
  .cart{position:fixed;bottom:0;left:0;right:0;top:auto;border-radius:16px 16px 0 0;z-index:60;max-width:100%}
  .cart.collapsed .cart-body,.cart.collapsed .cart-foot{display:none}
  .cart-body{max-height:38vh}
  .form-grid{grid-template-columns:1fr}
}

.inv-tbl td{border:1px solid #cfc9e6;padding:6px 7px}

.inv-sum td:first-child{text-align:center;background:#f6f4fc;white-space:nowrap}

.inv-bank{margin-top:14px;font-size:12px}
.inv-foot{margin-top:20px;font-size:11px;color:#666}

  body.inv-open *{visibility:hidden}

  .inv-sheet{box-shadow:none;margin:0;width:auto;max-width:100%;padding:8mm}
  @page{size:A4;margin:9mm}
}

function brandClient(){ return isAdmin()?null:(state.user&&state.user.client); }
function _hex6(v){ return /^#[0-9a-fA-F]{6}$/.test(String(v||'')); }
function brandColor(){ const c=brandClient(); return (c&&_hex6(c.color))?c.color:null; }
function shade(hex,pct){ const n=parseInt(String(hex).slice(1),16); const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
  const r=cl(((n>>16)&255)*(1+pct)), g=cl(((n>>8)&255)*(1+pct)), b=cl((n&255)*(1+pct));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
/* 발주처 브랜드 컬러를 앱 전체 포인트 색으로 적용 (미설정이면 KD 그린) */

}

async function boot(){
  const url=cleanUrl(localStorage.getItem('oms_url')||SUPA_URL), key=(localStorage.getItem('oms_key')||SUPA_KEY||'').trim();
  state.lang=localStorage.getItem('oms_lang')||'ja';
  document.documentElement.lang=state.lang;
  if(!url||!key){ show('setup'); return; }
  try{ SB=supabase.createClient(url,key); }catch(e){ show('setup'); return; }
  const token=localStorage.getItem('oms_token'), saved=localStorage.getItem('oms_user');
  if(token&&saved){
    try{
      const {data,error}=await SB.rpc('session_dept',{p_token:token});
      if(!error&&data){ state.token=token; state.user=JSON.parse(saved); openApp(); return; }
    }catch(e){/* 만료/오류 → 로그인 화면 */}
    localStorage.removeItem('oms_token'); localStorage.removeItem('oms_user');
  }
  show('login');
}
function show(id){ ['setup','login','app'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id)); }
function cleanUrl(u){ u=(u||'').trim().replace(/\s+/g,''); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; const m=u.match(/^https?:\/\/[^\/]+\.supabase\.(co|in|net)/i); return m?m[0]:u.replace(/\/+$/,''); }

function saveSetup(){
  const url=cleanUrl(document.getElementById('supaUrl').value);
  const key=document.getElementById('supaKey').value.trim();
  const err=document.getElementById('setupErr');
  if(!url||!key){ err.textContent='URLとkeyを入力してください'; err.classList.remove('hidden'); return; }
  localStorage.setItem('oms_url',url); localStorage.setItem('oms_key',key);
  SB=supabase.createClient(url,key); show('login');
}
function resetSetup(){ localStorage.removeItem('oms_url'); localStorage.removeItem('oms_key'); localStorage.removeItem('oms_user'); localStorage.removeItem('oms_token'); show('setup'); }

async function doLogin(){
  const u=document.getElementById('lgUser').value.trim();
  const p=document.getElementById('lgPass').value;
  const err=document.getElementById('loginErr'), btn=document.getElementById('lgBtn');
  err.classList.add('hidden'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{
    const {data,error}=await SB.rpc('verify_login',{p_username:u,p_password:p});
    if(error) throw error;
    const row=Array.isArray(data)?data[0]:data;
    if(!row||!row.token){ err.textContent='IDまたはパスワードが違います'; err.classList.remove('hidden'); return; }
    state.token=row.token;
    state.user={username:row.username,name:row.display_name,dept:row.department,company:row.company||'',client_id:row.client_id||null,client:row.client_id?{id:row.client_id,name:row.client_name,name_ko:row.client_name_ko,postal:row.client_postal,addr1:row.client_addr1,tel:row.client_tel,email:row.client_email}:null};state.viewClientId=null;
    localStorage.setItem('oms_token',state.token);
    localStorage.setItem('oms_user',JSON.stringify(state.user));
    openApp(); logActivity('login');
  }catch(e){
    err.textContent='接続エラー: '+(e.message||e); err.classList.remove('hidden');
  }finally{ btn.disabled=false; btn.textContent='ログイン'; }
}
async function logout(){
  stopOrderPolling();

  localStorage.removeItem('oms_token'); localStorage.removeItem('oms_user');
  state.token=null; state.user=null; state.cart=[];
  document.getElementById('lgPass').value=''; show('login');
}

async function loadAll(){
  const view=document.getElementById('view');
  view.innerHTML=`<div class="loading-full"><div class="spinner"></div><span>${t('loading')}</span></div>`;
  try{
    if(isAdmin()){
      const {data:cl}=await SB.from('clients').select('*').order('code');
      state.clients=cl||[];
      /* 관리자 기본값은 '전체'(null) — 특정 거래처는 드롭다운에서 선택 */
    }
    const cid=activeClientId();
    // 상품: 발주처 계정 → 배정된 것만(가격 오버라이드), 관리자 → 전체 마스터
    if(cid && !isAdmin()){
      const {data:pc}=await SB.rpc('client_catalog',{p_client:cid});
      state.products=pc||[]; state.catalog=null;
    } else {
      const {data:p}=await SB.from('products').select('*').order('category').order('id');
      state.products=p||[];
      // 관리자가 특정 거래처 선택 시: 発注 화면은 그 거래처 배정 카탈로그로 필터(商品マスターは全件のまま)
      if(cid && isAdmin()){
        const {data:pc}=await SB.rpc('client_catalog',{p_client:cid});
        state.catalog=pc||[];
      } else { state.catalog=null; }
    }
    // 배송지·발주내역: 활성 발주처로 격리
    let sQ=SB.from('stores').select('*').order('id');
    let oQ=SB.from('orders').select('*').order('order_date',{ascending:false}).order('id',{ascending:false});
    if(cid && !isAdmin()){ sQ=sQ.contains('client_ids',[cid]); }   // 관리자: 모든 배송지 다 봄
    if(cid){ oQ=oQ.eq('client_id',cid); }
    const [s,o]=await Promise.all([sQ,oQ]);
    state.stores=s.data||[]; state.orders=o.data||[];
    // 발주처 계정: 자기 회사 정보(로고 포함) 최신화 → 상단 브랜딩에 사용
    if(cid && !isAdmin()){
      try{ const {data:me}=await SB.from('clients').select('*').eq('id',cid).maybeSingle();
        if(me) state.user.client=Object.assign({},state.user.client||{},me);
      }catch(_){}
    }
    try{ const {data:cfg}=await SB.from('app_settings').select('v').eq('k','mail').maybeSingle(); state.mailCfg=cfg&&cfg.v?JSON.parse(cfg.v):{}; }catch(e){ state.mailCfg={}; }
    await loadAllocated();
  }catch(e){ toast('データ取得エラー: '+e.message,true); }
}
/* 配送予定 = 発注確認済(確定・未出荷)の受注数量を商品別に集計。倉庫全体の引当なので全取引先分を対象にする */
async function loadAllocated(){
  const alloc={};
  try{
    const {data:cor}=await SB.from('orders').select('id').eq('status','発注確認済');
    const ids=(cor||[]).map(o=>o.id);
    if(ids.length){
      const {data:items}=await SB.from('order_items').select('product_id,qty').in('order_id',ids);
      (items||[]).forEach(it=>{ if(it.product_id!=null) alloc[it.product_id]=(alloc[it.product_id]||0)+(Number(it.qty)||0); });
    }
  }catch(e){ /* 失敗時は空(=配送予定0) */ }
  state.allocated=alloc;
}

/* ---------- 発注アラート(赤バッジ + ポーリング) ---------- */
function pendingCount(){ return state.orders.filter(o=>o.status==='\u767a\u6ce8\u6e08').length; }
let _lastPending=null, _pollTimer=null, _seenIds=new Set();
function updateOrderBadge(){
  const btn=document.querySelector('#tabs button[data-tab="history"]');
  if(!btn) return;
  const n=pendingCount();
  let b=btn.querySelector('.tab-badge');
  if(n>0){ if(!b){ b=document.createElement('span'); b.className='tab-badge'; btn.appendChild(b); } b.textContent=n; }
  else if(b){ b.remove(); }
}
function startOrderPolling(){
  stopOrderPolling(); _lastPending=pendingCount();
  _seenIds=new Set((state.orders||[]).map(o=>o.id)); updateOrderBadge();
  _pollTimer=setInterval(async()=>{
    if(!state.user||!SB) return;
    await reloadOrders(); const n=pendingCount(); updateOrderBadge();
    // 新しく入った発注を特定し「どの取引先から来たか」を通知
    const fresh=(state.orders||[]).filter(o=>o.status==='\u767a\u6ce8\u6e08'&&!_seenIds.has(o.id));
    (state.orders||[]).forEach(o=>_seenIds.add(o.id));
    if(fresh.length && state.user.dept==='admin'){
      state.newOrders=[...new Set([...(state.newOrders||[]),...fresh.map(o=>o.id)])];
      const cliBy={}; (state.clients||[]).forEach(c=>cliBy[c.id]=c);
      const g={}; fresh.forEach(o=>{ const nm=(cliBy[o.client_id]&&clientDisp(cliBy[o.client_id]))||('#'+o.client_id);
        (g[nm]=g[nm]||[]).push(o.order_no); });
      const lines=Object.keys(g).map(nm=>nm+'\uff08'+g[nm].join(', ')+'\uff09').join(' / ');
      toast('\ud83d\udd14 '+(state.lang==='ja'?'\u65b0\u898f\u767a\u6ce8':'\uc0c8 \ubc1c\uc8fc')+' '+fresh.length+(state.lang==='ja'?'\u4ef6':'\uac74')+' \u2014 '+lines, true);
      startAlarm();
      if(activeTab==='history') viewHistory();
    }
    _lastPending=n;
  }, 25000);
}
/* 新規発注の通知音（①クリアベル・3音余韻）＋ 確認するまで繰り返し */
let _alarmTimer=null, _ac=null;
function _ding(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  _ac=_ac||new A(); if(_ac.state==='suspended') _ac.resume();
  const bell=(freq,start,dur,vol,type)=>{ const t=_ac.currentTime+start; const o=_ac.createOscillator(),g=_ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03); };
  bell(1319,0,0.55,0.22,'sine'); bell(1047,0.18,0.6,0.20,'sine'); bell(1568,0.4,1.5,0.20,'sine'); bell(784,0.4,1.6,0.05,'sine');
}catch(_){} }
function startAlarm(){ if(_alarmTimer) return; _ding();
  _alarmTimer=setInterval(()=>{ if(!(state.newOrders&&state.newOrders.length)){ stopAlarm(); return; } _ding(); }, 5000); }
function stopAlarm(){ if(_alarmTimer){ clearInterval(_alarmTimer); _alarmTimer=null; } }
function stopOrderPolling(){ if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; } }

function onSearch(v){ state.catalogQ=v; renderOrderRows(); }
function setCat(c){ state.catalogCat=c; viewCatalog(); }
function filteredProducts(){
  const q=state.catalogQ.trim().toLowerCase();
  const base=state.catalog||state.products;
  return base.filter(p=>{
    if(state.catalogCat!=='all'&&p.category!==state.catalogCat) return false;
    if(!q) return true;
    return (p.name||'').toLowerCase().includes(q)||(p.jan||'').includes(q)||(p.brand||'').toLowerCase().includes(q)||(p.color||'').toLowerCase().includes(q);
  });
}

function fixtureCell(f){
  if(f==='O') return '<span class="fxO">O</span>';
  if(f==='X') return '<span class="fxX">X</span>';
  return esc(f||'');
}
async function saveNote(pid,val){
  try{
    const {error}=await SB.from('products').update({note:val}).eq('id',pid);
    if(error) throw error;
    const p=state.products.find(x=>x.id===pid); if(p) p.note=val;
    const pc=state.catalog&&state.catalog.find(x=>x.id===pid); if(pc) pc.note=val;
    toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}
async function saveStockField(pid,field,raw){
  const p=state.products.find(x=>x.id===pid); if(!p) return;
  const val=field==='lead_time'?raw:(parseInt(raw)||0);
  p[field]=val;
  const pc=state.catalog&&state.catalog.find(x=>x.id===pid); if(pc) pc[field]=val;
  try{
    const {error}=await SB.from('products').update({[field]:val}).eq('id',pid);
    if(error) throw error;
    if(field==='stock'){
      const cell=document.getElementById('avail-'+pid);
      if(cell){ const inc=(state.allocated&&state.allocated[pid])||0; const av=(p.stock||0)-inc; cell.textContent=av; cell.className='savail '+(av>0?'pos':'zero'); }
    }
    toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}
async function saveFixture(pid,val){
  const p=state.products.find(x=>x.id===pid); if(!p) return;
  p.fixture=val;
  const pc=state.catalog&&state.catalog.find(x=>x.id===pid); if(pc) pc.fixture=val;
  try{
    const {error}=await SB.from('products').update({fixture:val}).eq('id',pid);
    if(error) throw error;
    toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}
async function savePmField(pid,field,raw){
  const val=(raw||'').trim();
  const p=state.products.find(x=>x.id===pid); if(!p) return;
  if((p[field]||'')===val) return;            // 変更なし → 何もしない
  p[field]=val;
  const pc=state.catalog&&state.catalog.find(x=>x.id===pid); if(pc) pc[field]=val;
  const pm=state.master&&state.master.find(x=>x.id===pid); if(pm) pm[field]=val;
  try{
    const {error}=await SB.from('products').update({[field]:val}).eq('id',pid);
    if(error) throw error;
    toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

function setBoxQuiet(pid,boxes){
  boxes=Math.max(0,boxes|0);
  const p=state.products.find(x=>x.id===pid); if(!p) return;
  const idx=state.cart.findIndex(c=>c.product_id===pid);
  if(boxes===0){ if(idx>=0) state.cart.splice(idx,1); }
  else{
    const item={product_id:p.id,name:p.name,category:p.category,color:p.color,jan:p.jan,
      inbox:p.inbox,shitadai:p.shitadai,joudai:p.joudai,boxes,stock:p.stock};
    if(idx>=0) state.cart[idx]=item; else state.cart.push(item);
  }
}
function setBox(pid,boxes){
  boxes=Math.max(0,boxes|0);
  const p=state.products.find(x=>x.id===pid); if(!p) return;
  const idx=state.cart.findIndex(c=>c.product_id===pid);
  if(boxes===0){ if(idx>=0) state.cart.splice(idx,1); }
  else{
    const item={product_id:p.id,name:p.name,category:p.category,color:p.color,jan:p.jan,
      inbox:p.inbox,shitadai:p.shitadai,joudai:p.joudai,boxes,stock:p.stock};
    if(idx>=0) state.cart[idx]=item; else state.cart.push(item);
  }
  renderOrderRows(); renderOrderBar();
}
function cartTotals(){
  let box=0,pcs=0,amt=0,jou=0;
  state.cart.forEach(c=>{const q=c.boxes*c.inbox; box+=c.boxes; pcs+=q; amt+=q*c.shitadai; jou+=q*c.joudai;});
  return{box,pcs,amt,jou};
}

function todayISO(){ const d=new Date(); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
async function placeOrder(){
  if(!state.cart.length) return;
  if(!state.stores.length){ toast(t('no_store'),true); return; }
  const storeId=parseInt(document.getElementById('cartStore').value);
  const store=state.stores.find(s=>s.id===storeId);
  if(!store){ toast(t('no_store'),true); return; }
  const dlvVal=(document.getElementById('cartDate')||{}).value||'';
  if(dlvVal && dlvVal<todayISO()){ toast(t('past_date'),true); return; }
  const manualNo=((document.getElementById('cartOrderNo')||{}).value||'').trim();
  const odOverride=((document.getElementById('cartOrderDate')||{}).value||'').trim();
  if(manualNo && state.orders.find(o=>o.order_no===manualNo)){ if(!confirm(t('dup_no'))) return; }
  if(!confirm(t('confirm_order'))) return;
  const tot=cartTotals();
  try{
    let orderNo=manualNo;
    if(!orderNo){
      const now=new Date(); const ym=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0');
      const {count}=await SB.from('orders').select('*',{count:'exact',head:true}).like('order_no',ym+'-%');
      orderNo=ym+'-'+String((count||0)+1).padStart(3,'0');
    }
    const storeSnap=`${store.name}\n\u3012${store.postal}\n${store.address}\nTEL:${store.tel} ${store.manager?'/ '+store.manager:''}`;
    const dlv=(document.getElementById('cartDate')||{}).value||null;
    const insertObj={
      client_id:activeClientId(), order_no:orderNo, store_id:storeId, store_snapshot:storeSnap, created_by:state.user.username,
      status:'\u767a\u6ce8\u6e08', total_qty:tot.pcs, total_shitadai:tot.amt, total_joudai:tot.jou,
      delivery_date:dlv, warehouse:'KD'
    };
    if(odOverride) insertObj.order_date=odOverride;
    const {data:ord,error:e1}=await SB.from('orders').insert(insertObj).select().single();
    if(e1) throw e1;
    const items=state.cart.map(c=>{const q=c.boxes*c.inbox;return{
      order_id:ord.id, product_id:c.product_id, jan:c.jan, product_name:c.name, category:c.category,
      qty:q, unit_shitadai:c.shitadai, unit_joudai:c.joudai, subtotal:q*c.shitadai};});
    const {error:e2}=await SB.from('order_items').insert(items); if(e2) throw e2;
    state.cart=[]; state.orderNo=''; state.orderDate2=''; await reloadOrders(); updateOrderBadge();
    logActivity('order',orderNo);
    toast(t('order_done')+' ('+orderNo+')');
    viewCatalog();
  }catch(e){ toast('\u30a8\u30e9\u30fc: '+e.message,true); }
}

async function saveStore(id){
  const o={name:val('st_name'),postal:val('st_postal'),address:val('st_address'),tel:val('st_tel'),manager:val('st_manager'),email:val('st_email')};
  if(isAdmin()){ const ids=[...document.querySelectorAll('.st-cli:checked')].map(c=>Number(c.value)); if(!ids.length){ toast(state.lang==='ja'?'取引先を1つ以上選択してください':'발주처를 1개 이상 선택하세요',true); return; } o.client_ids=ids; o.client_id=ids[0]; } else if(!id){ const acid=activeClientId(); if(acid!=null){ o.client_ids=[acid]; o.client_id=acid; } }
  if(!o.name||!o.address){ toast(state.lang==='ja'?'店舗名と住所は必須です':'매장명과 주소는 필수입니다',true); return; }
  try{ if(id) await SB.from('stores').update(o).eq('id',id); else await SB.from('stores').insert(o);
    await reloadStores(); closeModal(); viewStores(); toast(t('saved'));
  }catch(e){ toast('エラー: '+e.message,true); }
}
async function delStore(id){ if(!confirm(t('confirm_del'))) return;
  await SB.from('stores').delete().eq('id',id); await reloadStores(); viewStores(); toast(t('deleted')); }

function renderStockTbl(q){
  q=(q||'').toLowerCase();
  const list=state.products.filter(p=>!q||(p.name||'').toLowerCase().includes(q)||(p.jan||'').includes(q)||(p.brand||'').toLowerCase().includes(q));
  document.getElementById('stkBody').innerHTML=list.map(p=>`<tr>
    <td><span class="pcat">${esc(p.category)}</span></td>
    <td>${esc(p.name)}${p.color?`<div class="pcolor">${esc(p.color)}</div>`:''}</td>
    <td class="mono" style="font-size:12px;color:var(--muted)">${esc(p.jan)}</td>
    <td class="t-right mono">${yen(p.shitadai)}</td>
    <td class="t-right mono" style="color:var(--muted)">${yen(p.joudai)}</td>
    <td class="t-center">${p.inbox}</td>
    <td class="t-right"><span class="pstock ${stockClass(p.stock)}">${p.stock}</span></td></tr>`).join('')
    ||`<tr><td colspan="7" class="t-center" style="padding:40px;color:#8a9a92">${t('no_data')}</td></tr>`;
}

function statusBadge(s,alert){const m={'発注済':'ord','発注確認済':'cfm','配送済':'shp','出荷済':'shp','キャンセル':'cnl','保留':'hld'};
  const lbl={'発注済':t('ordered'),'発注確認済':t('confirmed'),'配送済':t('shipped'),'出荷済':t('shipped'),'キャンセル':t('cancelled'),'保留':t('st_hold')};
  if(alert) return `<span class="badge new">${lbl[s]||s}</span>`;
  return `<span class="badge ${m[s]||'ord'}">${lbl[s]||s}</span>`;}
function storeNameOf(o){ return String(o.store_snapshot||'').split(/\\n|\n|\u3012/)[0].trim(); }
function toggleHistSel(id,on){ state.histSel=state.histSel||[]; if(on){ if(!state.histSel.includes(id)) state.histSel.push(id); } else { state.histSel=state.histSel.filter(x=>x!==id); } viewHistory(); }
function clearNewOrders(){ state.newOrders=[]; stopAlarm(); viewHistory(); }
function selectHistDir(d){ state.histDir=d; state.histCli=null; viewHistory(); }
function selectHistCli(id){ state.histCli=id; viewHistory(); }
function toggleHistAll(on){ const ids=state.histView||state.orders.map(o=>o.id); state.histSel=on?ids.slice():[]; viewHistory(); }
function invoiceHistSelected(){ if(state.histSel&&state.histSel.length) openInvoice({orderIds:state.histSel}); }
async function moveHistMonth(delta){
  const sel=state.histSel||[]; if(!sel.length) return;
  const orders=state.orders.filter(o=>sel.includes(o.id));
  if(!confirm(t(delta>0?'move_next_confirm':'move_prev_confirm').replace('{n}',orders.length))) return;
  try{
    for(const o of orders){
      const nb=monthShift(billMonthOf(o),delta);
      const {error}=await SB.from('orders').update({bill_month:nb}).eq('id',o.id);
      if(error) throw error;
    }
    await reloadOrders(); state.histSel=[]; viewHistory(); toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

async function deleteOrder(id){
  const o=state.orders.find(x=>x.id===id);
  const msg=(state.lang==='ja'?'この発注を削除しますか？この操作は取り消せません。\n':'이 발주를 삭제할까요? 되돌릴 수 없습니다.\n')+(o?o.order_no:'');
  if(!confirm(msg)) return;
  try{
    await SB.from('order_items').delete().eq('order_id',id);
    await SB.from('orders').delete().eq('id',id);
    await reloadOrders(); updateOrderBadge(); closeModal(); viewHistory(); toast(t('deleted'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

function recalcEdit(){
  let tot=0;
  (window._editItems||[]).forEach((it,i)=>{
    const qe=document.querySelector(`[data-ei="${i}"][data-f="qty"]`), ue=document.querySelector(`[data-ei="${i}"][data-f="unit_shitadai"]`);
    const q=Number(qe&&qe.value)||0, u=Number(ue&&ue.value)||0;
    it.qty=q; it.unit_shitadai=u; it.subtotal=q*u; tot+=it.subtotal;
    const c=document.getElementById('esub'+i); if(c) c.textContent=yen(it.subtotal);
  });
  const et=document.getElementById('etot'); if(et) et.textContent=yen(tot);

function sendOrderMail(id,type){

  const to=(store&&store.email)?store.email:(cfg.clientEmail||'');
  const {subject,body}=mailTemplate(type,o);
  // EmailJS 自動送信(設定済みの場合)
  if(cfg.ejsKey&&cfg.ejsService&&cfg.ejsTemplate&&to&&typeof emailjs!=='undefined'){
    toast(t('mail_sending'));

      to_email:to, cc_email:cfg.cc||'', subject, message:body,
      order_no:o.order_no, order_date:o.order_date, qty:o.total_qty, amount:yen(o.total_shitadai)
    },{publicKey:cfg.ejsKey})
    .then(()=>{ toast(t('mail_sent')+' → '+to); logActivity('mail',o.order_no+' '+type); })
    .catch(e=>{ toast(t('mail_fail')+' '+((e&&e.text)||''),true); _openMailto(to,subject,body); });
    return;
  }
  // フォールバック: メール下書きを開く
  if(!to) toast(t('mail_noaddr'),true); else toast(t('mail_hint'));
  _openMailto(to,subject,body);
}

async function saveHold(id,useSel){
  const o=state.orders.find(x=>x.id===id);
  const note=((document.getElementById('h_note')||{}).value||'').trim();
  const eta=(document.getElementById('h_eta')||{}).value||null;
  try{
    if(!useSel){ // 発注まるごと保留
      const {error}=await SB.from('orders').update({status:'保留',hold_note:note||null,hold_eta:eta,hold_prev:(o&&o.status!=='保留')?o.status:null}).eq('id',id);
      if(error) throw error;
    } else {    // 選択分だけ -B に分割して保留
      const sel=state.holdSel||[];
      const {data:items}=await SB.from('order_items').select('*').eq('order_id',id);
      const move=(items||[]).filter(it=>sel.includes(it.id));
      const stay=(items||[]).filter(it=>!sel.includes(it.id));
      if(!move.length) throw new Error('選択なし');
      if(!stay.length){ // 全部選んだ場合は分割せずまるごと保留
        const {error}=await SB.from('orders').update({status:'保留',hold_note:note||null,hold_eta:eta,hold_prev:o.status}).eq('id',id);
        if(error) throw error;
      } else {
        const sum=arr=>arr.reduce((a,it)=>({q:a.q+Number(it.qty||0),s:a.s+Number(it.subtotal||0),j:a.j+Number(it.qty||0)*Number(it.unit_joudai||0)}),{q:0,s:0,j:0});
        const mv=sum(move), st=sum(stay);
        // 枝番を決める（-B, -C, ...）
        const base=String(o.order_no||'');
        let suf='B'; for(let c=66;c<=90;c++){ if(!(state.orders||[]).some(x=>x.order_no===base+'-'+String.fromCharCode(c))){ suf=String.fromCharCode(c); break; } }
        const {data:ins,error:ie}=await SB.from('orders').insert({
          client_id:o.client_id, order_no:base+'-'+suf, store_id:o.store_id, store_snapshot:o.store_snapshot,
          created_by:state.user.username, status:'保留', total_qty:mv.q, total_shitadai:mv.s, total_joudai:mv.j,
          delivery_date:eta||o.delivery_date, order_date:o.order_date, warehouse:o.warehouse||'KD',
          bill_month:o.bill_month, hold_note:note||null, hold_eta:eta, hold_prev:o.status
        }).select('id').single();
        if(ie) throw ie;
        for(const it of move){ const {error:ue}=await SB.from('order_items').update({order_id:ins.id}).eq('id',it.id); if(ue) throw ue; }
        const {error:oe}=await SB.from('orders').update({total_qty:st.q,total_shitadai:st.s,total_joudai:st.j}).eq('id',id);
        if(oe) throw oe;
      }
    }
    await reloadOrders(); updateOrderBadge(); closeModal(); viewHistory(); toast(t('saved'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

/* 請求対象＝発送済みのみ（保留・キャンセル・未発送は除外） */
function isBillable(o){ return !!o && (o.status==='配送済'||o.status==='出荷済'); }
function toggleBillSel(id,on){ state.billSel=state.billSel||[]; if(on){ if(!state.billSel.includes(id)) state.billSel.push(id); } else { state.billSel=state.billSel.filter(x=>x!==id); } renderBilling(); }
function toggleBillAll(on){ const m=document.getElementById('billMonth').value; const ids=state.orders.filter(o=>billMonthOf(o)===m&&isBillable(o)).map(o=>o.id); state.billSel=on?ids:[]; renderBilling(); }
function invoiceSelected(){ if(state.billSel&&state.billSel.length) openInvoice({orderIds:state.billSel}); }
function renderBilling(){
  const m=document.getElementById('billMonth').value;
  const list=state.orders.filter(o=>billMonthOf(o)===m&&isBillable(o));
  const total=list.reduce((s,o)=>s+Number(o.total_shitadai),0);
  const qty=list.reduce((s,o)=>s+Number(o.total_qty),0);
  const sel=state.billSel||[];
  const selList=list.filter(o=>sel.includes(o.id));
  const selTotal=selList.reduce((s,o)=>s+Number(o.total_shitadai),0);
  const allOn=list.length>0&&selList.length===list.length;
  const btn=document.getElementById('billSelBtn');
  if(btn){ btn.disabled=selList.length===0; btn.textContent=selList.length?`${t('inv_selected')}（${selList.length}）`:t('inv_selected'); }
  document.getElementById('billBody').innerHTML=`
    <div class="stat-grid">
      <div class="stat"><div class="k">${t('billing_total')}</div><div class="v teal mono">${yen(total)}</div><div class="sub">${m}</div></div>
      <div class="stat"><div class="k">${t('order_count')}</div><div class="v navy mono">${list.length}</div></div>
      <div class="stat"><div class="k">${state.lang==='ja'?'選択中の請求額':'선택 청구액'}</div><div class="v navy mono">${yen(selTotal)}</div><div class="sub">${selList.length}${t('items_unit')}</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:36px" class="t-center"><input type="checkbox" ${allOn?'checked':''} onchange="toggleBillAll(this.checked)"></th>
      <th>${t('order_no')}</th><th>${t('order_date')}</th><th>${t('store')}</th>
      <th class="t-right">${t('items')}</th><th class="t-right">${t('amount')}</th></tr></thead>
      <tbody>${list.length?list.map(o=>`<tr class="${sel.includes(o.id)?'has':''}">
        <td class="t-center"><input type="checkbox" ${sel.includes(o.id)?'checked':''} onchange="toggleBillSel(${o.id},this.checked)"></td>
        <td class="mono" style="font-weight:700">${esc(o.order_no)}</td>
        <td class="mono">${esc(o.order_date)}</td><td style="font-size:13px;white-space:nowrap">${esc(storeNameOf(o))}</td>
        <td class="t-right mono">${o.total_qty}</td><td class="t-right mono" style="font-weight:700">${yen(o.total_shitadai)}</td></tr>`).join('')
        :`<tr><td colspan="6" class="t-center" style="padding:40px;color:#8a9a92">${t('no_data')}</td></tr>`}</tbody>
      ${list.length?`<tfoot><tr style="border-top:2px solid var(--line)"><td colspan="5" class="t-right" style="font-weight:700;padding:13px">${t('billing_total')}</td>
        <td class="t-right mono" style="font-weight:800;font-size:15px;padding:13px;color:var(--teal-d)">${yen(total)}</td></tr></tfoot>`:''}
    </table></div>`;
}
function exportBillingCsv(){
  const m=document.getElementById('billMonth').value;
  const list=state.orders.filter(o=>billMonthOf(o)===m&&isBillable(o));
  const rows=[['発注NO','発注日','配送先','点数','請求額(下代)']];
  list.forEach(o=>rows.push([o.order_no,o.order_date,storeNameOf(o),o.total_qty,o.total_shitadai]));
  dlCsv(rows,`請求_${m}.csv`);
}

async function renderReport(){
  const months=parseInt(document.getElementById('repPeriod').value);
  const mode=(document.getElementById('repDir')&&document.getElementById('repDir').value)||'sell';
  const isBuy=mode==='buy', ja=state.lang==='ja';
  const cut=new Date(); cut.setMonth(cut.getMonth()-months);
  const cutM=`${cut.getFullYear()}-${String(cut.getMonth()+1).padStart(2,'0')}`;
  const dirOf={}; (state.clients||[]).forEach(c=>dirOf[c.id]=c.direction||'sell');
  const rangeOrders=state.orders.filter(o=>isBillable(o)&&billMonthOf(o)>=cutM&&((dirOf[o.client_id]||'sell')===mode));
  // 月選択（期間内の月一覧）
  const monthsInRange=[...new Set(rangeOrders.map(billMonthOf))].sort().reverse();
  let repMonth=state.repMonth||'';
  if(repMonth&&!monthsInRange.includes(repMonth)){ repMonth=''; state.repMonth=''; }
  const mLabel=ym=>{const p=ym.split('-');return ja?`${p[0]}年${+p[1]}月`:`${p[0]}년 ${+p[1]}월`;};
  const mw=document.getElementById('repMonthWrap');
  if(mw){ mw.innerHTML=`<select class="sel" onchange="state.repMonth=this.value;renderReport()">
    <option value="">${ja?'期間全体':'기간 전체'}</option>
    ${monthsInRange.map(m=>`<option value="${m}" ${repMonth===m?'selected':''}>${mLabel(m)}</option>`).join('')}</select>`; }
  // 選択月で全体を絞り込み（未選択＝期間全体）
  const orders=repMonth?rangeOrders.filter(o=>billMonthOf(o)===repMonth):rangeOrders;
  const ids=orders.map(o=>o.id);
  let items=[];
  if(ids.length){ const {data}=await SB.from('order_items').select('*').in('order_id',ids); items=data||[]; }
  const prodBy={}; (state.products||[]).forEach(p=>prodBy[p.id]=p); (state.master||[]).forEach(p=>{if(!prodBy[p.id])prodBy[p.id]=p;});
  const UNC=ja?'未分類':'미분류';
  // 見出し
  const amtWord=isBuy?(ja?'仕入':'사입'):(ja?'売上':'매출');
  const setTxt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  setTxt('ttlBrand',(ja?'ブランド別 ':'브랜드별 ')+amtWord);
  setTxt('ttlCat',(ja?'カテゴリ別 ':'카테고리별 ')+amtWord);
  setTxt('ttlSub',(ja?'商品分類別 ':'商品分類별 ')+amtWord);
  // 統計
  const totAmt=orders.reduce((s,o)=>s+Number(o.total_shitadai),0);
  const totQty=orders.reduce((s,o)=>s+Number(o.total_qty),0);
  document.getElementById('repStats').innerHTML=`
    <div class="stat"><div class="k">${isBuy?(ja?'確定仕入(下代)':'확정 사입(원가)'):(ja?'確定売上(下代)':'확정 매출(납품가)')}${repMonth?`<span style="color:var(--muted)"> · ${mLabel(repMonth)}</span>`:''}</div><div class="v teal mono">${yen(totAmt)}</div></div>
    <div class="stat"><div class="k">${isBuy?(ja?'仕入件数':'사입 건수'):(ja?'売上件数':'매출 건수')}</div><div class="v navy mono">${orders.length}</div></div>
    <div class="stat"><div class="k">${isBuy?(ja?'仕入点数':'사입 품목수'):(ja?'販売点数':'판매 품목수')}</div><div class="v navy mono">${totQty}</div></div>`;
  // ブランド／カテゴリ／商品分類 それぞれ集計
  const byBrand={},byCat={},bySub={};
  items.forEach(it=>{ const p=prodBy[it.product_id]; const amt=Number(it.subtotal);
    const b=(p&&p.brand)||UNC, c=(p&&p.category)||it.category||UNC, s=(p&&p.subcat)||UNC;
    byBrand[b]=(byBrand[b]||0)+amt; byCat[c]=(byCat[c]||0)+amt; bySub[s]=(bySub[s]||0)+amt; });
  const topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const tb=topN(byBrand,8), tc=topN(byCat,8), ts=topN(bySub,8);
  repBar('chBrand','brand',tb.map(e=>e[0]),tb.map(e=>e[1]),'#0e9f6e',totAmt);
  repBar('chCat','cat',tc.map(e=>e[0]),tc.map(e=>e[1]),'#2563eb',totAmt);
  repBar('chSub','sub',ts.map(e=>e[0]),ts.map(e=>e[1]),'#d97706',totAmt);
  // 取引先(会社)別
  const cliName={}; (state.clients||[]).forEach(c=>cliName[c.id]=clientDisp(c)||c.name);
  const byClient={}; orders.forEach(o=>{ const k=cliName[o.client_id]||('#'+o.client_id); byClient[k]=(byClient[k]||0)+Number(o.total_shitadai); });
  const tcl=topN(byClient,8);
  setTxt('ttlClient',(ja?'取引先別 ':'거래처별 ')+amtWord);
  repBar('chClient','client',tcl.map(e=>e[0]),tcl.map(e=>e[1]),'#7c3aed',totAmt);
  // 月別／四半期別 推移
  const useQ=(state.repGran||'month')==='quarter';
  setTxt('ttlTrend',useQ?(ja?'四半期別推移':'분기별 추이'):(ja?'月別推移（クリックで月を選択）':'월별 추이 (막대 클릭으로 월 선택)'));
  const byBucket={}; rangeOrders.forEach(o=>{const ym=billMonthOf(o); let key=ym;
    if(useQ){ const p=ym.split('-'); const q=Math.ceil((parseInt(p[1])||1)/3); key=p[0]+' Q'+q; }
    byBucket[key]=(byBucket[key]||0)+Number(o.total_shitadai);});
  const mk=Object.keys(byBucket).sort();
  const barCols=mk.map(k=>(!useQ&&repMonth&&k===repMonth)?'#0e9f6e':'#1b2a4a');
  if(charts.trend) charts.trend.destroy();
  charts.trend=new Chart(document.getElementById('chTrend'),{type:'bar',
    data:{labels:mk,datasets:[{data:mk.map(m=>byBucket[m]),backgroundColor:barCols,borderRadius:6}]},
    options:{onClick:(e,els)=>{if(useQ)return; if(els&&els.length){const lbl=mk[els[0].index]; state.repMonth=(state.repMonth===lbl?'':lbl); renderReport();}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'¥'+Number(c.parsed.y).toLocaleString('ja-JP')}}},scales:{y:{ticks:{callback:v=>'¥'+(v/1000)+'k'}}},responsive:true}});
  // 商品TOP10
  const byProd={};
  items.forEach(it=>{const k=it.product_name; const p=prodBy[it.product_id]; byProd[k]=byProd[k]||{qty:0,amt:0,cat:(p&&p.category)||it.category}; byProd[k].qty+=it.qty; byProd[k].amt+=Number(it.subtotal);});
  const top=Object.entries(byProd).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);
  const qtyLab=isBuy?(ja?'仕入数':'사입수'):(ja?'販売数':'판매수');
  document.getElementById('topProds').innerHTML=top.length?`<div class="tbl-wrap" style="box-shadow:none;border:1px solid var(--line)"><table>
    <thead><tr><th style="width:40px">#</th><th>${t('name')}</th><th>${t('category')}</th><th class="t-right">${qtyLab}</th><th class="t-right">${t('amount')}</th></tr></thead>
    <tbody>${top.map((e,i)=>`<tr><td style="font-weight:800;color:${i<3?'var(--teal-d)':'var(--muted)'}">${i+1}</td>
      <td style="font-size:12.5px;font-weight:600">${esc(e[0])}</td><td><span class="pcat">${esc(e[1].cat)}</span></td>
      <td class="t-right mono" style="font-weight:700">${e[1].qty}</td><td class="t-right mono">${yen(e[1].amt)}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty"><div class="ic">📊</div>${t('no_data')}</div>`;
}
function repBar(cid,key,labels,data,color,total){
  if(charts[key]) charts[key].destroy();
  if(!labels.length){ charts[key]=null;
    const cv=document.getElementById(cid); if(cv){const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#8a9a92';ctx.font='13px sans-serif';ctx.fillText(state.lang==='ja'?'データなし':'데이터 없음',10,24);} return; }
  const denom=total||data.reduce((s,v)=>s+v,0)||1;
  charts[key]=new Chart(document.getElementById(cid),{type:'bar',
    data:{labels,datasets:[{data,backgroundColor:color,borderRadius:6,maxBarThickness:26}]},
    options:{indexAxis:'y',layout:{padding:{right:48}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'¥'+Number(c.parsed.x).toLocaleString('ja-JP')+'  ('+(c.parsed.x/denom*100).toFixed(1)+'%)'}}},
      scales:{x:{ticks:{callback:v=>'¥'+(v/1000)+'k'}},y:{ticks:{autoSkip:false,font:{size:11}}}},responsive:true},
    plugins:[{id:'pct_'+key,afterDatasetsDraw(chart){const {ctx}=chart;const meta=chart.getDatasetMeta(0);ctx.save();ctx.font='700 11px sans-serif';ctx.fillStyle='#4a5a52';ctx.textBaseline='middle';ctx.textAlign='left';meta.data.forEach((bar,i)=>{ctx.fillText((data[i]/denom*100).toFixed(1)+'%',bar.x+6,bar.y);});ctx.restore();}}]});
}

function viewWms(){
  const synced=state.products.filter(p=>p.stock_synced_at).length;
  const last=state.products.reduce((m,p)=>p.stock_synced_at&&(!m||p.stock_synced_at>m)?p.stock_synced_at:m,null);
  document.getElementById('view').innerHTML=`
    <div class="page-title">${t('tab_wms')}</div>
    <div class="page-desc">${t('wms_desc')}</div>
    <div class="card card-pad" style="max-width:620px;margin-top:8px">
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px;font-size:13px">
        <div><div style="color:var(--muted)">${t('wms_total')}</div><b style="font-size:20px">${state.products.length}</b></div>
        <div><div style="color:var(--muted)">${t('wms_synced')}</div><b style="font-size:20px">${synced}</b></div>
        <div><div style="color:var(--muted)">${t('wms_last')}</div><b style="font-size:14px">${last?new Date(last).toLocaleString('ja-JP'):'—'}</b></div>
      </div>
      <div style="background:#f6f8fc;border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.7;color:var(--muted)">
        ${t('wms_csv_help')}<br>
        <code style="background:#fff;padding:2px 6px;border-radius:4px;font-size:12px">JAN,在庫数</code> &nbsp;/&nbsp;
        <code style="background:#fff;padding:2px 6px;border-radius:4px;font-size:12px">jan,qty</code>
      </div>
      <input type="file" id="wmsFile" accept=".csv,text/csv" style="margin-bottom:14px">
      <button class="btn teal full" id="wmsBtn" onclick="runWmsSync()">${t('wms_run')}</button>
      <div id="wmsLog" style="margin-top:14px;font-size:13px;color:var(--muted)"></div>
    </div>`;
}
function parseCsv(text){
  const lines=text.replace(/\ufeff/g,'').split(/\r?\n/).filter(l=>l.trim());
  const rows=[]; let start=0;
  if(lines.length){ const h=lines[0].toLowerCase(); if(h.includes('jan')||h.includes('在庫')||h.includes('qty')) start=1; }
  for(let i=start;i<lines.length;i++){
    const c=lines[i].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(c.length<2) continue;
    const jan=c[0], qty=parseInt(c[1]);
    if(jan && !isNaN(qty)) rows.push({jan,qty});
  }
  return rows;
}
async function runWmsSync(){
  const f=document.getElementById('wmsFile').files[0], log=document.getElementById('wmsLog'), btn=document.getElementById('wmsBtn');
  if(!f){ toast(t('wms_nofile'),true); return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{
    const text=await f.text();
    const rows=parseCsv(text);
    if(!rows.length){ log.innerHTML=`<span style="color:var(--red)">${t('wms_empty')}</span>`; return; }
    const {data,error}=await SB.rpc('wms_upsert_stock',{p_rows:rows});
    if(error) throw error;
    const matched=(data||[]).filter(r=>r.matched).length;
    const unmatched=(data||[]).filter(r=>!r.matched);
    await reloadProducts();
    let html=`<span style="color:var(--teal-d);font-weight:700">✓ ${state.lang==='ja'?'同期完了':'동기화 완료'}</span> — ${state.lang==='ja'?'更新':'갱신'} ${matched} / ${state.lang==='ja'?'未一致':'미일치'} ${unmatched.length}`;
    if(unmatched.length) html+=`<div style="margin-top:8px;color:var(--red);font-size:12px">${state.lang==='ja'?'未一致JAN':'미일치 JAN'}: ${unmatched.slice(0,20).map(r=>esc(r.jan)).join(', ')}${unmatched.length>20?' …':''}</div>`;
    log.innerHTML=html;
    toast(t('saved'));
  }catch(e){ log.innerHTML=`<span style="color:var(--red)">エラー: ${esc(e.message||e)}</span>`; }
  finally{ btn.disabled=false; btn.textContent=t('wms_run'); }
}

/* ============================================================
   注文書PDF取込 — JAN照合で発注数量を自動入力 + 配送先/配送日 自動
   ============================================================ */
function _norm(s){ return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[!&・,，。.\-_/（）()\[\]【】]/g,'').toLowerCase(); }
function nextBusinessDay(){
  const d=new Date(); d.setDate(d.getDate()+1);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function _qtyBoxes(dataText,jan,pr,isDelivery){
  const txt=String(dataText).replace(jan,' ');
  const toks=txt.match(/\d[\d,]*(?:\.\d+)?/g)||[];
  const nums=toks.map(s=>parseFloat(s.replace(/,/g,''))).filter(n=>isFinite(n)&&n>0);
  if(!nums.length||!pr) return 0;
  const inbox=pr.inbox||1;
  const ints=nums.filter(n=>Number.isInteger(n));
  // 納品書(入数×箱数=数量, 価格なし)
  if(isDelivery){
    // ① 「入数 × 箱数 = 数量」の三つ組を最優先（NO列や「4種」等の数字に惑わされない）
    for(let a=0;a<ints.length;a++){
      if(ints[a]!==inbox) continue;
      for(let b=0;b<ints.length;b++){
        if(b===a||ints[b]<1) continue;
        const prod=inbox*ints[b];
        for(let c=0;c<ints.length;c++){
          if(c===a||c===b) continue;
          if(ints[c]===prod) return ints[b];
        }
      }
    }
    // ② 数量だけ拾えた場合 → 入数の倍数(入数自身は除く)の最大値 ÷ 入数
    const cands=ints.filter(n=>n!==inbox && n>inbox && n%inbox===0);
    if(cands.length) return Math.max(...cands)/inbox;
    return 0; // 入数しか取れない等 → 誤って1にしない
  }
  const amt=Math.max(...nums); // 金額(小計)は行内で最大
  const _ints=nums.filter(n=>Number.isInteger(n));
  // ① 「数量 × 単価 = 小計」かつ数量が入数の倍数 → 箱数 = 数量 ÷ 入数
  //    PDF内の数字だけで検証するので、PDFの単価がカタログ単価と違っても正確
  for(let qi=0;qi<_ints.length;qi++){
    const q=_ints[qi];
    if(q===amt || inbox<=0 || q<inbox || q%inbox!==0) continue;
    for(let pi=0;pi<_ints.length;pi++){
      if(pi===qi) continue;
      if(Math.abs(q*_ints[pi]-amt)<=1) return q/inbox;
    }
  }
  // ② 金額 ÷ (入数 × カタログ単価[下代/上代]) = 箱数
  for(const price of [pr.shitadai,pr.joudai]){
    if(!price) continue; const per=inbox*price;
    if(per>0){ const b=amt/per; if(b>=1 && Math.abs(b-Math.round(b))<0.03) return Math.round(b); }
  }
  // ③ 数量(個数)=単価(小数,10以上)の直前の整数 → ÷入数
  const vals=toks.map(s=>({n:parseFloat(s.replace(/,/g,'')),dec:s.includes('.')}));
  const pi=vals.findIndex(v=>v.dec&&v.n>=10);
  if(pi>0){ for(let j=pi-1;j>=0;j--){ if(!vals[j].dec){ return Math.max(0,Math.round(vals[j].n/inbox)); } } }
  return 0;
}
async function importOrderPdf(input){
  const f=input.files&&input.files[0]; if(!f) return; input.value='';
  if(typeof pdfjsLib==='undefined'){ toast('PDF.js '+(state.lang==='ja'?'読み込み中…再度お試しください':'로딩 중… 다시 시도해주세요'),true); return; }
  toast(t('pdf_parsing'));
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    const lines=[]; let fullText='';
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p); const tc=await page.getTextContent();
      // 同じ行のセルはYが微妙にズレることがある → 許容誤差でグルーピング
      const items=[];
      tc.items.forEach(it=>{ const str=(it.str||''); if(!str.trim()) return;
        items.push({y:it.transform[5],x:it.transform[4],str}); });
      const rows=[];
      items.forEach(it=>{ let r=null;
        for(const rr of rows){ if(Math.abs(rr.y-it.y)<=2.6){ r=rr; break; } }
        if(!r){ r={y:it.y,items:[]}; rows.push(r); }
        r.items.push(it); });
      rows.sort((a,b)=>b.y-a.y);
      rows.forEach(r=>{ const text=r.items.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ');
        lines.push(text); fullText+=text+'\n'; });
    }
    const prodByJan={}; state.products.forEach(pr=>{ if(pr.jan) prodByJan[String(pr.jan).replace(/\D/g,'')]=pr; });
    // インボイス登録番号(T+13桁)を文書全体から抽出して除外リスト化（商品JANと誤認しないため）
    const regNos=new Set(); const _nfk=fullText.normalize('NFKC');
    let _rm; const _rre=/(?:^|[^0-9A-Za-z])T[ \t\u3000]*([0-9]{13})/g;
    while((_rm=_rre.exec(_nfk))){ regNos.add(_rm[1]); }
    // 納品書(数量=入数×箱数, 単価なし)か判定 → 箱数を直接算出するため
    const isDelivery=/納品書/.test(fullText) && /箱数/.test(fullText);
    const matched=[], miss=[], seen={};
    for(let i=0;i<lines.length;i++){
      // インボイス登録番号(T+13桁)や適格請求書番号は商品JANではないので除外
      if(/登録番号|適格請求書|インボイス番号/.test(lines[i])) continue;
      const lm=lines[i].match(/(\d{8,14})/); if(!lm) continue;
      const jan=lm[1];
      // 登録番号として抽出済み or 直前が「T」の数字列は除外
      if(regNos.has(jan)) continue;
      const _idx=lines[i].indexOf(jan);
      if(_idx>0 && /[TtＴｔ]/.test(lines[i].charAt(_idx-1))) continue;
      if(seen[jan]) continue; seen[jan]=1;
      const pr=prodByJan[jan];
      if(!pr){ miss.push(jan); continue; }
      // JANが単独行の場合のみ次行を連結（「小計/合計」行を巻き込まないようガード）
      let dataText=lines[i];
      const _selfN=(lines[i].replace(jan,' ').match(/\d[\d,]*(?:\.\d+)?/g)||[]).length;
      const _nx=lines[i+1]||'';
      if(i+1<lines.length && !/\d{8,14}/.test(_nx) && _selfN<3
         && !/(小\s*計|合\s*計|消費税|税込|税別|振込|備考|以上)/.test(_nx)) dataText+=' '+_nx;
      const boxes=_qtyBoxes(dataText,jan,pr,isDelivery);
      if(boxes>0) matched.push({jan,name:pr.name,id:pr.id,qty:boxes});
    }
    let store=null, best=0;
    const flat=_norm(fullText);
    state.stores.forEach(s=>{
      const nm=_norm(s.name);
      if(nm&&nm.length>=3&&flat.includes(nm)&&nm.length>best){ store=s; best=nm.length; }
    });
    if(!store){ // 共通プレフィックス(&choa!等)を除いた特徴部分で再照合
      state.stores.forEach(s=>{
        const tail=_norm(String(s.name||'').replace(/^[&＆]?\s*choa[!！]?\s*/i,'').replace(/^[（(].*?[)）]/,''));
        if(tail&&tail.length>=3&&flat.includes(tail)&&tail.length>best){ store=s; best=tail.length; }
      });
    }
    if(!matched.length){ toast(t('pdf_none'),true); return; }
    // 注文書/納品書から 発注No / 発注日 を抽出
    // ※PDFは文字間に空白が入ったり全角記号が混ざるため、NFKC正規化＋空白除去してから探す
    let pdfNo='', pdfDate='';
    const _T=fullText.normalize('NFKC').replace(/[ \t\u3000\u00a0]/g,'');
    const _pickDate=(lab)=>{
      const m=_T.match(new RegExp(lab+'[^0-9]{0,3}(\\d{4})[^0-9]{1,2}(\\d{1,2})[^0-9]{1,2}(\\d{1,2})'));
      if(!m) return '';
      const mm=Number(m[2]), dd=Number(m[3]);
      if(mm<1||mm>12||dd<1||dd>31) return '';
      return `${m[1]}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    };
    const mno=_T.match(/発注(?:N[oO]|番号)[^0-9]{0,3}([0-9][0-9\-]{3,11})/);

const BK_TABLES=['clients','products','stores','orders','order_items','client_products','client_brand_rate','documents','app_settings','activity_log','users'];
async function fullBackup(){
  if(!isAdmin()) return;
  const L=state.lang==='ja';
  if(typeof ExcelJS==='undefined'||typeof JSZip==='undefined'){ toast(L?'ライブラリ読み込み中…再度お試しください':'라이브러리 로딩 중… 다시 시도해주세요',true); return; }
  const btn=document.getElementById('bkBtn'); if(btn) btn.disabled=true;
  try{
    toast(L?'バックアップ作成中…':'백업 만드는 중…');
    const dump={_meta:{app:'KD OMS',created_at:new Date().toISOString(),by:(state.user&&state.user.username)||'',source:location.href},tables:{}};
    const wb=new ExcelJS.Workbook();
    for(const tb of BK_TABLES){
      toast(`${L?'取得中':'가져오는 중'}: ${tb}`);
      let rows=null;
      try{ const {data,error}=await SB.from(tb).select('*'); if(error) throw error; rows=data||[]; }
      catch(e){ dump.tables[tb]={_error:String((e&&e.message)||e)}; continue; }
      dump.tables[tb]=rows;
      const ws=wb.addWorksheet(tb.slice(0,31));
      const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
      if(!keys.length){ ws.addRow([L?'(データなし)':'(데이터 없음)']); continue; }
      ws.addRow(keys); ws.getRow(1).font={bold:true};
      ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF3F1'}};
      rows.forEach(r=>ws.addRow(keys.map(k=>{
        let v=r[k]; if(v===null||v===undefined) return '';
        if(typeof v==='object') v=JSON.stringify(v);
        v=String(v);
        return v.length>2000?`[${L?'長いデータ → data.json 参照':'긴 데이터 → data.json 참조'}]`:v;
      })));
      ws.columns.forEach(c=>{c.width=16;});
      ws.views=[{state:'frozen',ySplit:1}];
    }
    const zip=new JSZip();
    zip.file('data.json',JSON.stringify(dump,null,1));
    zip.file('KD-OMS_backup.xlsx',await wb.xlsx.writeBuffer());
    // 資料(規定書) PDF 실물 파일
    const docs=Array.isArray(dump.tables.documents)?dump.tables.documents:[];
    let okf=0,ngf=0;
    if(docs.length){
      const fol=zip.folder(L?'資料':'자료');
      for(let i=0;i<docs.length;i++){
        const d=docs[i];
        toast(`${L?'資料':'자료'} ${i+1}/${docs.length}`);
        if(!d.url){ ngf++; continue; }
        try{
          const r=await fetch(d.url); if(!r.ok) throw new Error('http '+r.status);
          const sf=v=>String(v||'').replace(/[\\/:*?"<>|]/g,'_').trim();
          const dir=d.brand?sf(d.brand)+'/':'';
          fol.file(dir+(sf(d.name)||('doc'+d.id))+'.pdf', await r.blob()); okf++;
        }catch(_){ ngf++; }
      }
    }
    const cnt=Object.keys(dump.tables).map(k=>`  - ${k}: ${Array.isArray(dump.tables[k])?dump.tables[k].length+(L?'件':'건'):'ERROR'}`).join('\n');
    zip.file('README.txt',
`KD OMS ${L?'全体バックアップ':'전체 백업'}
${L?'作成日時':'생성일시'}: ${new Date().toLocaleString('ja-JP')}

[${L?'中身':'내용물'}]
- data.json ............ ${L?'復元用の完全データ（これが本体）':'복원용 완전 데이터 (이게 본체)'}
- KD-OMS_backup.xlsx ... ${L?'閲覧用（Excelで開けます）':'열람용 (엑셀로 열림)'}
- ${L?'資料/':'자료/'} ................ ${L?'規定書PDFの実ファイル':'규정서 PDF 실제 파일'} (OK:${okf}${ngf?` / NG:${ngf}`:''})

[${L?'テーブル':'테이블'}]
${cnt}

[${L?'復元方法':'복원 방법'}]
1. ${L?'Supabaseで新規プロジェクトを作成':'Supabase에서 새 프로젝트 생성'}
2. oms_setup.sql ${L?'を実行してテーブルを作成':'실행해서 테이블 생성'}
3. data.json ${L?'のデータを取り込む（Claudeに渡せば投入用SQLを作成できます）':'의 데이터를 넣기 (Claude에게 주면 투입용 SQL을 만들어줍니다)'}
4. ${L?'資料/のPDFをStorageの kiteisho バケットにアップロード':'자료/의 PDF를 Storage의 kiteisho 버킷에 업로드'}

${L?'※ このファイルは全社データです。取り扱いにご注意ください。':'※ 이 파일은 전사 데이터입니다. 취급에 주의하세요.'}`);
    toast(L?'ZIP圧縮中…':'ZIP 압축 중…');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const z=n=>String(n).padStart(2,'0'); const dt=new Date();
    _dlBlob(blob,`KD-OMS_backup_${dt.getFullYear()}${z(dt.getMonth()+1)}${z(dt.getDate())}_${z(dt.getHours())}${z(dt.getMinutes())}.zip`,'application/zip');
    toast(`${L?'バックアップ完了':'백업 완료'} — ${L?'資料':'자료'} ${okf}${L?'件':'건'}${ngf?` / ${L?'失敗':'실패'} ${ngf}`:''}`);
  }catch(e){ toast('エラー: '+((e&&e.message)||e),true); }
  finally{ if(btn) btn.disabled=false; }
}

function _dlBlob(buf,name,mime){ const a=document.createElement('a');
  a.href=URL.createObjectURL(buf instanceof Blob?buf:new Blob([buf],{type:mime||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function _cellVal(v){ if(v==null) return '';
  if(typeof v==='object'){ if('text' in v) return v.text; if('result' in v) return v.result;
    if('richText' in v&&Array.isArray(v.richText)) return v.richText.map(x=>x.text).join(''); if('hyperlink' in v) return v.text||v.hyperlink; return ''; }
  return v; }
function _num(v,d){ const n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?Math.round(n):d; }
async function _readExcel(file,MAP){
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const ws=wb.worksheets[0]; const rows=[]; if(!ws) return rows;
  let head=null, colMap={};
  ws.eachRow({includeEmpty:false},(row)=>{
    const cells=[]; row.eachCell({includeEmpty:true},(c,cn)=>{ cells[cn-1]=_cellVal(c.value); });
    if(!head){ head=cells.map(x=>String(x==null?'':x).trim());
      head.forEach((h,i)=>{ const k=MAP[h]||MAP[h.replace(/[\s　]/g,'').replace(/[(（].*?[)）]/g,'')]; if(k) colMap[i]=k; });
      return; }
    const o={}; let any=false;
    cells.forEach((v,i)=>{ if(colMap[i]){ o[colMap[i]]=v; if(v!=null&&String(v).trim()!=='') any=true; } });
    if(any) rows.push(o);
  });
  return rows;
}

async function bulkUploadProducts(input){
  const f=input.files&&input.files[0]; if(!f) return; input.value='';
  toast(state.lang==='ja'?'読み込み中…':'불러오는 중…');
  try{
    const rows=await _readExcel(f,PMAP);
    if(!rows.length){ toast(t('xls_empty'),true); return; }
    const {data:existing}=await SB.from('products').select('id,jan');
    const byJan={}; (existing||[]).forEach(p=>{ if(p.jan) byJan[String(p.jan)]=p.id; });
    let ins=0,upd=0,err=0,emsg='';
    for(const r of rows){
      const jan=String(r.jan||'').trim(); const name=String(r.name||'').trim();
      if(!jan&&!name) continue;
      const base={category:r.category||'',brand:r.brand||'',jan,name,color:r.color||'',
        inbox:_num(r.inbox,1),shitadai:_num(r.shitadai,0),joudai:_num(r.joudai,0),
        fixture:r.fixture||'',note:r.note||'',lead_time:String(r.lead_time||'').trim(),active:true};
      try{
        if(jan&&byJan[jan]){ const {error}=await SB.from('products').update(base).eq('id',byJan[jan]); if(error) throw error; upd++; }
        else{ const {error}=await SB.from('products').insert({...base,stock:_num(r.stock,0)}); if(error) throw error; ins++; }
      }catch(e){ err++; if(!emsg) emsg=(e.message||String(e)); }
    }
    await reloadProducts(); viewProducts();
    toast(`${t('xls_done')}  +${ins} / ↻${upd}${err?' / ✗'+err:''}`, err>0);
    if(err) console.warn('bulk product errors:', emsg);
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

/* ============================================================
   請求書(KD様式) — 月次の発注から生成 / PDF印刷 + Excel出力
   ※ KD・取引先情報はここで編集できます
   ============================================================ */
const KD_INFO={ name:'株式会社KD', postal:'〒169-0072',
  addr1:'東京都新宿区大久保2-1-8', addr2:'新大樹ビル3F 310号',
  tel:'TEL : 03-6629-9695', jct:'登録番号 T7011201026875', bank:'' };
/* 登録番号ラベルを付与 */
function regFmt(v){ v=String(v||'').trim(); if(!v) return ''; return /登録番号/.test(v)?v:('登録番号 '+v); }
/* 取引の向き(direction)で 発行元(issuer)と宛先(recipient/御中)を自動で入れ替える
   - sell(販売 KD→取引先): 発行=KD(登録番号あり) / 御中=取引先
   - buy (仕入 取引先→KD): 発行=取引先(登録番号あり) / 御中=KD(登録番号なし) */
function billParties(){
  const c=activeClientObj()||{}; const dir=c.direction||'sell';
  if(dir==='buy'){
    return { issuer:{ name:c.name||'—', postal:c.postal||'', addr1:c.addr1||'', addr2:'', tel:c.tel||'', jct:regFmt(c.regno), bank:'' },
             recipient:{ name:KD_INFO.name, postal:KD_INFO.postal, addr1:KD_INFO.addr1+(KD_INFO.addr2?(' '+KD_INFO.addr2):''), tel:KD_INFO.tel } };
  }
  return { issuer:KD_INFO,
           recipient:{ name:c.name||'—', postal:c.postal||'', addr1:c.addr1||'', tel:c.tel||'' } };

const invYen=n=>'¥ '+Number(n||0).toLocaleString('ja-JP');
function invToday(){ const d=new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function invDueDate(month){ const [y,m]=month.split('-').map(Number); const d=new Date(y,m+1,0);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function invNo(month,total){ const nm=(billParties().recipient.name||'請求書').replace(/[\\/:*?"<>|\s　御中様]/g,'').slice(0,12)||'請求書'; return `${nm}請求書_${month.replace('-','')}-001_${total}JPY`; }

let _invCtx=null;
function _invCompany(){
  if(!isAdmin() && state.user && state.user.client){ return clientDisp(state.user.client)||state.user.client.name||'KD'; }
  return (typeof KD_INFO!=='undefined' && KD_INFO.name)?KD_INFO.name:'KD';
}
async function getInvoiceItems(opts){
  const docType=opts.docType||'invoice';
  const docWord=docType==='delivery'?'納品書':'請求書';
  const _co=(_invCompany()||'KD').replace(/[\\/:*?"<>|]/g,'').trim()||'KD';
  const _dt=new Date(); const _today=`${_dt.getFullYear()}${String(_dt.getMonth()+1).padStart(2,'0')}${String(_dt.getDate()).padStart(2,'0')}`;
  let orders, fileBase, month, orderDate='', deliveryDate='', warehouse='KD';
  if(opts.orderId){
    const o=state.orders.find(x=>x.id===opts.orderId);
    orders=o?[o]:[]; month=o?o.order_date.slice(0,7):'';
    if(o){ orderDate=o.order_date||''; deliveryDate=o.delivery_date||''; warehouse=o.warehouse||'KD'; }
    fileBase=o?`${_co}_${docWord}_${_today}_${o.order_no}`:`${_co}_${docWord}_${_today}`;
  }else if(opts.orderIds&&opts.orderIds.length){
    orders=state.orders.filter(o=>opts.orderIds.includes(o.id)&&isBillable(o));
    month=orders.length?billMonthOf(orders[0]):'';
    if(orders.length===1){ const o=orders[0]; orderDate=o.order_date||''; deliveryDate=o.delivery_date||''; warehouse=o.warehouse||'KD'; fileBase=`${_co}_${docWord}_${_today}_${o.order_no}`; }
    else fileBase=`${_co}_${docWord}_${month.replace('-','')}`;
  }else{
    month=opts.month;
    orders=state.orders.filter(o=>billMonthOf(o)===month && isBillable(o));
    fileBase=`${_co}_${docWord}_${month.replace('-','')}`;
  }
  const orderNos=orders.map(o=>o.order_no).sort();
  const ids=orders.map(o=>o.id);
  let items=[];
  if(ids.length){ const {data}=await SB.from('order_items').select('*').in('order_id',ids); items=data||[]; }
  const map={};
  items.forEach(it=>{ const k=it.jan||it.product_name;
    if(!map[k]){ const prod=state.products.find(p=>p.jan===it.jan);
      map[k]={jan:it.jan||'',name:it.product_name,qty:0,joudai:Number(it.unit_joudai)||0,shitadai:Number(it.unit_shitadai)||0,amount:0,inbox:(prod&&prod.inbox)?prod.inbox:1}; }
    map[k].qty+=Number(it.qty); map[k].amount+=Number(it.subtotal); });
  const lines=Object.values(map).sort((a,b)=>b.amount-a.amount);
  lines.forEach(l=>{ l.boxes=l.inbox>0?Math.round(l.qty/l.inbox):l.qty; });
  const sub=lines.reduce((s,l)=>s+l.amount,0);
  const tax=Math.floor(sub*0.1); const total=sub+tax;
  return {lines,sub,tax,total,month,orderNos,fileBase,docType,orderDate,deliveryDate,warehouse,singleOrder:orders.length===1?orders[0]:null};
}

async function deliveryNoteModal(orderId){
  const o=state.orders.find(x=>x.id===orderId); if(!o) return;
  const ja=state.lang==='ja';
  let clients=state.clients||[];
  if(!clients.length){ try{ const {data}=await SB.from('clients').select('id,name,postal,addr1,tel,ship_from,direction'); clients=data||[]; }catch(e){} }
  const blockOf=c=>{ const p=[c.name]; if(c.postal)p.push('〒'+String(c.postal).replace(/^〒/,'')); if(c.addr1)p.push(c.addr1); if(c.tel)p.push('TEL:'+String(c.tel).replace(/^TEL[:：]?\s*/i,'')); return p.filter(Boolean).join('\n'); };
  const kdBlock=`${KD_INFO.name}\n〒${KD_INFO.postal}\n${KD_INFO.addr1}${KD_INFO.addr2?(' '+KD_INFO.addr2):''}\nTEL:${KD_INFO.tel}`;
  const oc=clients.find(c=>c.id===o.client_id);
  const defFrom=(oc&&oc.direction==='buy'&&oc.ship_from)?oc.ship_from:kdBlock;
  const cands=clients.filter(c=>(c.direction||'sell')==='sell');
  // この取引先に登録された配送先(배송처)を受取人候補に
  const cid=o.client_id;
  let sts=(state.stores||[]).filter(s=>storeCids(s).includes(cid)||s.client_id===cid);
  if(!sts.length){ try{ const {data}=await SB.from('stores').select('*'); sts=(data||[]).filter(s=>storeCids(s).includes(cid)||s.client_id===cid); }catch(e){} }
  const storeBlock=s=>`${s.name}\n〒${s.postal||''}\n${s.address||''}\nTEL:${s.tel||''}${s.manager?' / '+s.manager:''}`;
  const storeOpts=sts.map(s=>`<option value="${esc(storeBlock(s))}">${esc(s.name)}</option>`).join('');
  openModal(ja?'納品書作成 — 差出人・お届け先':'납품서 작성 — 발송인·수취인',`
    <div class="fg"><label>${ja?'差出人（発送元）':'발송인(差出人)'}</label>
      <select class="sel" style="width:100%;margin-bottom:8px" onchange="if(this.value===' KD'){document.getElementById('dn_from').value=${JSON.stringify(kdBlock)}}else if(this.value){document.getElementById('dn_from').value=this.value}">
        <option value="">${ja?'取引先から選択して差し込み…':'거래처에서 선택해 채우기…'}</option>
        <option value=" KD">${esc(KD_INFO.name)}</option>
        ${cands.map(c=>`<option value="${esc(blockOf(c))}">${esc(c.name)}</option>`).join('')}
      </select>
      <textarea id="dn_from" rows="4" style="width:100%;resize:vertical">${esc(defFrom)}</textarea></div>
    <div class="fg"><label>${ja?'お届け先（受取人）':'수취인(お届け先)'}</label>
      ${storeOpts?`<select class="sel" style="width:100%;margin-bottom:8px" onchange="if(this.value){document.getElementById('dn_to').value=this.value}">
        <option value="">${ja?'登録配送先から選択…':'등록 배송처에서 선택…'}</option>
        ${storeOpts}
      </select>`:''}
      <textarea id="dn_to" rows="4" style="width:100%;resize:vertical">${esc(o.store_snapshot||'')}</textarea>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${ja?'この取引先に登録された配送先から選択、または編集できます。':'이 거래처에 등록된 배송처에서 선택하거나 수정할 수 있어요.'}</div></div>`,
    `<button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
     <button class="btn" onclick="_makeDeliv(${o.id})">${t('deliv_create')}</button>`);
}

function toggleInvEdit(){

  if(!on){ toast(state.lang==='ja'?'クリックして直接編集できます。終わったらPDFダウンロード。':'클릭해서 직접 수정하세요. 끝나면 PDF 다운로드.'); el.focus(); }

function printInvoice(){
  const src=document.getElementById('invoiceSheet'); if(!src) return;
  const name=((_invCtx&&_invCtx.fileBase)||'請求書')+'.pdf';
  const H2C=window.html2canvas;
  const JSPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(typeof H2C!=='function'||typeof JSPDF!=='function'){
    // フォールバック: ライブラリ未読込なら従来の印刷ダイアログ
    const prev=document.title; document.title=(_invCtx&&_invCtx.fileBase)||'請求書';
    let done=false; const restore=()=>{ if(done) return; done=true; document.title=prev; window.removeEventListener('afterprint',restore); };
    window.addEventListener('afterprint',restore);
    setTimeout(()=>{ window.print(); setTimeout(restore,1500); },50);
    return;
  }
  try{ logActivity(_invCtx&&_invCtx.docType==='delivery'?'delivery':'invoice',_invDetail(_invCtx)); }catch(_){}
  toast(state.lang==='ja'?'PDFを生成中…':'PDF 생성 중…');
  // オーバーレイの影響を避けるため、画面外にクリーン複製を作って撮影
  const holder=document.createElement('div');
  holder.style.cssText='position:absolute;left:0;top:0;z-index:0;background:#ffffff;width:820px;overflow:visible';
  const clone=src.cloneNode(true);
  clone.removeAttribute('contenteditable');
  clone.style.cssText='background:#ffffff;width:820px;max-width:820px;margin:0;padding:34px 40px 42px;box-shadow:none;color:#2b2940;font-size:13px';
  holder.appendChild(clone); document.body.appendChild(holder);
  const cleanup=()=>{ if(holder.parentNode) holder.parentNode.removeChild(holder); };
  H2C(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0,windowWidth:document.documentElement.scrollWidth}).then(canvas=>{
    cleanup();
    const pdf=new JSPDF('p','mm','a4');
    const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
    const margin=6, imgW=pageW-margin*2, imgH=canvas.height*imgW/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.98);
    const usableH=pageH-margin*2;
    let heightLeft=imgH, pos=margin;
    pdf.addImage(img,'JPEG',margin,pos,imgW,imgH,'','FAST');
    heightLeft-=usableH;
    while(heightLeft>0){ pos=margin-(imgH-heightLeft); pdf.addPage(); pdf.addImage(img,'JPEG',margin,pos,imgW,imgH,'','FAST'); heightLeft-=usableH; }
    pdf.save(name);
    toast(state.lang==='ja'?'PDFをダウンロードしました':'PDF를 다운로드했어요');
  }).catch(e=>{ cleanup(); toast('エラー: '+(e.message||e),true); });
}
