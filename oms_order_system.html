let _clLogo=null;
function pickClientLogo(input){
  const f=input.files&&input.files[0]; if(!f) return; input.value='';
  const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const maxW=320,maxH=90; let w=img.width,h=img.height;
      const sc=Math.min(maxW/w,maxH/h,1); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      // 흰 배경 자동 제거: 네 모서리가 모두 흰색일 때만 적용(투명 로고는 그대로 둠)
      try{
        const d=ctx.getImageData(0,0,w,h), p=d.data;
        const at=(x,y)=>{ const i=(y*w+x)*4; return [p[i],p[i+1],p[i+2],p[i+3]]; };
        const white=c=>c[3]>200&&c[0]>235&&c[1]>235&&c[2]>235;
        const corners=[at(0,0),at(w-1,0),at(0,h-1),at(w-1,h-1)];
        if(corners.every(white)){
          for(let i=0;i<p.length;i+=4){
            const oa=p[i+3]; if(!oa) continue;
            const a=1-Math.min(p[i],p[i+1],p[i+2])/255;
            if(a<=0.004){ p[i+3]=0; continue; }
            for(let k=0;k<3;k++) p[i+k]=Math.max(0,Math.min(255,Math.round((p[i+k]-255*(1-a))/a)));
            p[i+3]=Math.round(a*oa);
          }
          ctx.putImageData(d,0,0);
        }
      }catch(_){}
      _clLogo=cv.toDataURL('image/png');
      const pv=document.getElementById('c_logoPrev'); if(pv) pv.innerHTML=`<img src="${_clLogo}" style="max-width:100%;max-height:100%;object-fit:contain">`;
    };
    img.onerror=()=>toast(state.lang==='ja'?'画像を読み込めません':'이미지를 읽을 수 없어요',true);
    img.src=r.result; };
  r.readAsDataURL(f);
}

async function saveClient(id){
  const o={code:val('c_code'),name:val('c_name'),name_ko:val('c_nameko'),postal:val('c_postal'),
    addr1:val('c_addr'),tel:val('c_tel'),email:val('c_email'),active:val('c_active')==='true',
    direction:val('c_dir')||'sell',regno:val('c_regno').trim(),ship_from:(val('c_shipfrom')||'').trim()};
  if(_clLogo!==null) o.logo=_clLogo;
  const _col=(val('c_colorHex')||'').trim(); o.color=_hex6(_col)?_col.toUpperCase():null;
  if(!o.code||!o.name){ toast(state.lang==='ja'?'コードと取引先名は必須です':'코드와 발주처명은 필수입니다',true); return; }
  try{
    if(id){ await SB.from('clients').update(o).eq('id',id); }
    else{
      const {data:ins,error}=await SB.from('clients').insert(o).select('id').single();
      if(error) throw error;
      let uid=val('c_uid').trim(); const pw=val('c_upw').trim()||'pass1234';
      if(!uid) uid=(o.code||'').toLowerCase().replace(/[^a-z0-9]/g,'')+'_user';
      const {error:ue}=await SB.rpc('upsert_user',{p_token:state.token,p_id:null,p_username:uid,
        p_password:pw,p_display_name:o.name_ko||o.name,p_department:'purchasing',p_active:true,p_client_id:ins.id});
      if(ue) throw ue;
    }
    const {data}=await SB.from('clients').select('*').order('code'); state.clients=data||[];
    renderWho(); closeModal(); viewClients();
    toast(id?t('saved'):(state.lang==='ja'?'取引先とアカウントを作成しました':'발주처와 로그인 계정을 만들었어요'));
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

function brPreview(){ const rt=brRates();
  document.querySelectorAll('#view [data-brex]').forEach(cell=>{ const b=cell.dataset.brex; const pct=rt[b];
    const row=[...document.querySelectorAll('#view tr[data-pid]')].find(x=>x.dataset.brand===b);
    const jd=row?Number(row.dataset.joudai):0;
    cell.textContent=(pct!=null&&jd>0)?('¥'+Math.round(jd*pct/100)):'—';
  });
  document.querySelectorAll('#view tr[data-pid]').forEach(tr=>{ const b=tr.dataset.brand; const jd=Number(tr.dataset.joudai);
    const pct=rt[b]; const auto=(pct!=null&&jd>0)?Math.round(jd*pct/100):null;
    const ac=tr.querySelector('.br-auto'); if(ac) ac.textContent=auto!=null?('¥'+auto):'—';
    const pin=tr.querySelector('.asg-price'); if(pin) pin.placeholder=(auto!=null?String(auto):'');
  });
}
function asgAll(v){ document.querySelectorAll('#view .asg-on').forEach(cb=>cb.checked=v); }
async function saveAssign(){
  const cid=state.assignClientId; if(!cid) return;
  const rt=brRates();
  const rateUp=Object.keys(rt).map(b=>({client_id:cid, brand:b, pct:rt[b]}));
  const rows=[...document.querySelectorAll('#view tr[data-pid]')];
  const upserts=[], delIds=[];
  rows.forEach(tr=>{ const pid=Number(tr.dataset.pid);
    const on=tr.querySelector('.asg-on').checked;
    const pv=tr.querySelector('.asg-price').value.trim();
    if(on){ upserts.push({client_id:cid, product_id:pid, shitadai: pv===''?null:Number(pv), active:true}); }
    else { delIds.push(pid); }
  });
  try{
    if(rateUp.length) await SB.from('client_brand_rate').upsert(rateUp,{onConflict:'client_id,brand'});
    if(upserts.length) await SB.from('client_products').upsert(upserts,{onConflict:'client_id,product_id'});
    if(delIds.length) await SB.from('client_products').delete().eq('client_id',cid).in('product_id',delIds);
    toast(t('saved')); if(!isAdmin()||state.viewClientId===cid){ await loadAll(); } viewAssign();
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}

/* ===================== 運送状CSV（佐川急便 送り状取込・74項目） ===================== */
const SAGAWA_HEADER=["お届け先コード取得区分","お届け先コード","お届け先電話番号","お届け先郵便番号","お届け先住所１","お届け先住所２","お届け先住所３","お届け先名称１","お届け先名称２","お客様管理番号","お客様コード","部署ご担当者コード取得区分","部署ご担当者コード","部署ご担当者名称","荷送人電話番号","ご依頼主コード取得区分","ご依頼主コード","ご依頼主電話番号","ご依頼主郵便番号","ご依頼主住所１","ご依頼主住所２","ご依頼主名称１","ご依頼主名称２","荷姿","品名１","品名２","品名３","品名４","品名５","荷札荷姿","荷札品名１","荷札品名２","荷札品名３","荷札品名４","荷札品名５","荷札品名６","荷札品名７","荷札品名８","荷札品名９","荷札品名１０","荷札品名１１","出荷個数","スピード指定","クール便指定","配達日","配達指定時間帯","配達指定時間（時分）","代引金額","消費税","決済種別","保険金額","指定シール１","指定シール２","指定シール３","営業所受取","SRC区分","営業所受取営業所コード","元着区分","メールアドレス","ご不在時連絡先","出荷日","お問い合せ送り状No.","出荷場印字区分","集約解除指定","編集０１","編集０２","編集０３","編集０４","編集０５","編集０６","編集０７","編集０８","編集０９","編集１０"];
const WB_COSME_RE=/gel|cream|serum|toner|essence|lotion|mist|ampoule|cleans|balm|soothing|skin|cushion|mask|pack|lip|shampoo|patch|foam|sunscreen|化粧|コスメ|クリーム|セラム|ジェル|美容|スキン|パック|ローション|エッセンス|クレンジング|シャンプー|リップ|マスク|ネイル|クッション/i;
function _wbChunk(str,n){ str=String(str||'').trim(); const out=[]; for(let i=0;i<str.length&&out.length<n;i+=16) out.push(str.slice(i,i+16)); while(out.length<n) out.push(''); return out; }
function _wbPostal(p){ const d=String(p||'').replace(/[^0-9]/g,''); return d.length===7?d.slice(0,3)+'-'+d.slice(3):String(p||'').replace(/[^0-9\-]/g,''); }
function _wbTel(t){ return String(t||'').replace(/[^0-9\-]/g,''); }
function _wbYmd(s){ return String(s||'').replace(/[^0-9]/g,'').slice(0,8); }
function waybillDest(o){
  const s=(state.stores||[]).find(x=>x.id===o.store_id);
  if(s&&(s.name||s.address)) return {name:s.name||'',postal:s.postal||'',address:s.address||'',tel:s.tel||''};
  const snap=String(o.store_snapshot||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let name=snap[0]||'',postal='',tel='',addr='';
  snap.forEach((l,i)=>{ if(i===0) return;
    if(l.indexOf('〒')===0) postal=l.replace(/^〒/,'').trim();
    else if(/^TEL/i.test(l)) tel=l.replace(/^TEL[:：]?\s*/i,'').split(/[\/／]/)[0].trim();
    else if(!addr) addr=l; });
  return {name,postal,address:addr,tel};
}
function wbFiltered(){ const f=state.wbStatus||'発注確認済';
  let os=(state.orders||[]).filter(o=>o.status!=='キャンセル'&&o.status!=='保留');
  if(f!=='すべて') os=os.filter(o=>o.status===f);
  return os.slice().sort((a,b)=>String(b.order_date||'').localeCompare(String(a.order_date||''))); }
function setWbStatus(f){ state.wbStatus=f; state.wbSel=wbFiltered().map(o=>o.id); viewWaybill(); }
function toggleWbSel(id,on){ state.wbSel=state.wbSel||[]; if(on){ if(!state.wbSel.includes(id)) state.wbSel.push(id); } else { state.wbSel=state.wbSel.filter(x=>x!==id); } viewWaybill(); }
function toggleWbAll(){ const rows=wbFiltered(); const all=rows.length&&rows.every(o=>(state.wbSel||[]).includes(o.id)); state.wbSel=all?[]:rows.map(o=>o.id); viewWaybill(); }
function viewWaybill(){
  const L=state.lang==='ja';
  if(!state.wbStatus) state.wbStatus='発注確認済';
  const rows=wbFiltered();
  if(!state.wbSel) state.wbSel=rows.map(o=>o.id);
  const sel=state.wbSel||[];
  const chips=[['発注済','発注済','발주완료'],['発注確認済','発注確認済','발주확인'],['配送済','配送済','배송완료'],['すべて','すべて','전체']];
  document.getElementById('view').innerHTML=`
    <div class="page-title">${t('tab_waybill')}</div>
    <div class="page-desc">${L?'佐川急便 送り状取込フォーマット（74項目）で出力。住所は16桁ごとに住所1/2/3へ自動繰越し、品名は商品名から自動判定（化粧品／雑貨）、配達指定時間帯は01（午前中）固定、元着区分は元払です。':'사가와 송장 취込 양식(74항목) 출력. 주소는 16자리마다 住所1/2/3 자동 이월, 품명은 상품명 자동판정(화장품/잡화), 배달 시간대 01(오전중) 고정, 元着区分 선불입니다.'}</div>
    <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${chips.map(c=>`<button class="btn sm ${state.wbStatus===c[0]?'':'ghost'}" onclick="setWbStatus('${c[0]}')">${L?c[1]:c[2]}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px"><input type="checkbox" id="wbHead" checked> ${L?'見出し行':'헤더행'}</label>
        <span style="font-size:12px;color:var(--muted)">${L?'品名':'품명'}</span>
        <select id="wbItem" class="sel" style="padding:6px 8px;font-size:12px"><option value="auto">${L?'自動判定（商品名から）':'자동판정(상품명)'}</option><option value="zakka">雑貨</option><option value="cosme">化粧品</option></select>
        <button class="btn ghost sm" onclick="toggleWbAll()">${L?'全選択/解除':'전체선택/해제'}</button>
        <button class="btn sm" ${sel.length?'':'disabled'} onclick="downloadWaybillCsv('utf8')">⬇ CSV出力 (UTF-8)</button>
        <button class="btn ghost sm" ${sel.length?'':'disabled'} onclick="downloadWaybillCsv('sjis')">⬇ Shift-JIS</button>
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:36px"><input type="checkbox" ${rows.length&&rows.every(o=>sel.includes(o.id))?'checked':''} onclick="toggleWbAll()"></th>
        <th>${L?'発注NO':'발주NO'}</th><th>${L?'お届け先名称':'수취인'}</th><th>${L?'郵便番号':'우편번호'}</th><th>${L?'住所１':'주소1'}</th><th>${L?'住所２':'주소2'}</th><th>${L?'配達日':'배달일'}</th><th>${L?'電話':'전화'}</th></tr></thead>
      <tbody>${rows.map(o=>{const d=waybillDest(o);const a=_wbChunk(d.address,3);return `<tr>
        <td class="t-center"><input type="checkbox" ${sel.includes(o.id)?'checked':''} onchange="toggleWbSel(${o.id},this.checked)"></td>
        <td style="font-weight:700">${esc(o.order_no||'')}</td><td style="font-size:12.5px">${esc(d.name)}</td><td class="mono">${esc(_wbPostal(d.postal))}</td>
        <td style="font-size:12px">${esc(a[0])}</td><td style="font-size:12px;color:var(--muted)">${esc(a[1])}</td><td class="mono">${esc(o.delivery_date||'')}</td><td class="mono">${esc(_wbTel(d.tel))}</td></tr>`;}).join('')
        ||`<tr><td colspan="8" class="t-center" style="padding:36px;color:#8a9a92">${t('no_data')}</td></tr>`}</tbody>
    </table></div>`;
}
async function buildSagawaRows(){
  const sel=state.wbSel||[]; const orders=wbFiltered().filter(o=>sel.includes(o.id));
  const mode=(document.getElementById('wbItem')&&document.getElementById('wbItem').value)||'auto';
  const withHeader=!document.getElementById('wbHead')||document.getElementById('wbHead').checked;
  let itemsBy={};
  if(mode==='auto'&&orders.length){ const ids=orders.map(o=>o.id);
    try{ const {data}=await SB.from('order_items').select('order_id,product_name,category').in('order_id',ids);
      (data||[]).forEach(it=>{ (itemsBy[it.order_id]=itemsBy[it.order_id]||[]).push(it); }); }catch(e){} }
  const N=74, out=[];
  if(withHeader) out.push(SAGAWA_HEADER.slice());
  orders.forEach(o=>{
    const d=waybillDest(o); const a=_wbChunk(d.address,3); const nm=_wbChunk(d.name,2);
    const r=new Array(N).fill('');
    r[2]=_wbTel(d.tel); r[3]=_wbPostal(d.postal);
    r[4]=a[0]; r[5]=a[1]; r[6]=a[2]; r[7]=nm[0]; r[8]=nm[1];
    r[24]= mode==='cosme'?'化粧品': mode==='zakka'?'雑貨'
         : ((itemsBy[o.id]||[]).some(it=>WB_COSME_RE.test(String(it.product_name||'')+' '+String(it.category||'')))?'化粧品':'雑貨');
    if(o.delivery_date) r[44]=_wbYmd(o.delivery_date);   /* 配達日 YYYYMMDD */
    r[41]='1';   /* 出荷個数 */
    r[45]='01';  /* 配達指定時間帯 = 午前中 */
    r[57]='1';   /* 元着区分 = 元払 */
    out.push(r);
  });
  return out;
}
function _wbDl(blob,fname){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
async function downloadWaybillCsv(enc){
  const sel=state.wbSel||[]; if(!sel.length){ toast(state.lang==='ja'?'発注を選択してください':'발주를 선택하세요',true); return; }
  try{
    const rows=await buildSagawaRows();
    const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const csv=rows.map(r=>r.map(cell).join(',')).join('\r\n');
    const ymd=new Date().toISOString().slice(0,10).replace(/-/g,'');
    const fname='sagawa_okurijo_'+ymd+'.csv';
    if(enc==='sjis'){
      if(typeof Encoding==='undefined'){ toast(state.lang==='ja'?'SJIS未読込→UTF-8で出力':'SJIS 미로딩 → UTF-8 출력',true); _wbDl(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),fname); }
      else { const arr=Encoding.convert(Encoding.stringToCode(csv),{to:'SJIS',from:'UNICODE'}); _wbDl(new Blob([new Uint8Array(arr)],{type:'text/csv'}),fname); }
    } else { _wbDl(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),fname); }
    const cnt=orders_selected_count();
    toast((state.lang==='ja'?'運送状CSVを出力しました':'운송장 CSV 출력 완료')+' ('+cnt+')');
    if(typeof logActivity==='function') logActivity('waybill_csv',cnt+'件');
  }catch(e){ toast('エラー: '+(e.message||e),true); }
}
function orders_selected_count(){ return (state.wbSel||[]).filter(id=>wbFiltered().some(o=>o.id===id)).length; }

boot();
